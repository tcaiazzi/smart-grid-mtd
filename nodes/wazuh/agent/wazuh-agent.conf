<!--
  Wazuh agent profile of a lab host. wazuh-agent-setup.sh fills MANAGER_IP and
  appends one <localfile> per log the host ships.

  File integrity, rootkit, inventory and configuration scans are off: they run
  at start-up, load the node while the experiment calibrates its timing, and
  nothing here consumes what they report. The agent ships the logs it is told
  to and runs the manager's active responses.
-->
<ossec_config>
  <client>
    <server>
      <address>MANAGER_IP</address>
      <port>1514</port>
      <protocol>tcp</protocol>
    </server>
    <notify_time>10</notify_time>
    <time-reconnect>20</time-reconnect>
    <auto_restart>no</auto_restart>
    <crypto_method>aes</crypto_method>
    <enrollment>
      <enabled>no</enabled>
    </enrollment>
  </client>

  <client_buffer>
    <disabled>no</disabled>
    <queue_size>5000</queue_size>
    <events_per_second>500</events_per_second>
  </client_buffer>

  <active-response>
    <disabled>no</disabled>
  </active-response>

  <syscheck>
    <disabled>yes</disabled>
  </syscheck>
  <rootcheck>
    <disabled>yes</disabled>
  </rootcheck>
  <wodle name="syscollector">
    <disabled>yes</disabled>
  </wodle>
  <sca>
    <enabled>no</enabled>
  </sca>

  <logging>
    <log_format>plain</log_format>
  </logging>
</ossec_config>
