<!--
  scenario-guide.html — a step-by-step guide to adding a scenario to the cyber
  range, with a lab of its own or as a variant of the cps lab, which writes the
  scenario's skeleton as it goes.

  Part of the documentation site (docs/, copied as-is by mkdocs): open it from
  `make docs-serve` at /scenario-guide.html, or straight from the file system.
  Unlike the dashboards, which run where a lab may have no internet access, this
  is a docs page and loads its libraries from a CDN (highlighting, the topology
  graph, the zip); without them it still works, plainer.

  The skeleton comes from generateScenario() in the first script and the page's
  content from view() in the second, both pure (no DOM):
  tests/core/test_scenario_guide.py runs them under node, runs the scenario the
  first writes on a fake lab, renders every step with the second, and checks the two #guide-contract blocks
  against the repository, so the guide cannot drift from the code unseen.
-->

    const p = m.slice(1).map(Number);
    if (p.some(x => x > 255)) return null;
    return (((p[0] << 24) >>> 0) + (p[1] << 16) + (p[2] << 8) + p[3]) >>> 0;
  }
  function cidr(s) {
    const m = /^([\d.]+)\/(\d{1,2})$/.exec(String(s || "").trim());
    if (!m) return null;
    const addr = ip4(m[1]), len = Number(m[2]);
    if (addr === null || len > 32) return null;
    const mask = len === 0 ? 0 : (0xffffffff << (32 - len)) >>> 0;
    return { addr, len, mask, net: (addr & mask) >>> 0 };
  }


  function validateComponents(spec, contract, err, warn, nodeNames) {
    (spec.components || []).forEach((c, i) => {
      const def = (contract.components || {})[c && c.type];
      if (!def) { err("episode", `Component ${i + 1}: '${c && c.type}' is not a component of the planes.`); return; }
      if (!isVariant(spec) && !(spec.phases || []).some(p => p.name === c.phase))
        err("episode", `${c.type} starts in phase '${c.phase}', which the episode does not have.`);
      for (const p of def.params) {
        const v = String((c.args || {})[p.name] || "").trim();
        if (contract.node_params.includes(p.name)) {
          const node = v || unquote(p.default);
          if (!node) err("episode", `${c.type}: choose the node for '${p.name}'.`);
          else if (!nodeNames.includes(node)) err("episode", `${c.type}: '${p.name}' is '${node}', which the lab does not have.`);
        } else if (!v && p.default === null && p.name !== "seed") {
          err("episode", `${c.type}: '${p.name}' has no default and needs a value.`);
        }
      }
      for (const node of componentNodes(contract, c)) {
        if (!nodeNames.includes(node) || !def.files.length) continue;
        const image = imageOfNode(spec, contract, node);
        const has = imagePackages(spec, contract, image);
        if (has === null) { err("image", `${c.type} stages files on ${node}, whose image (${image || "Kathará's default"}) is not built here: nothing says what Python it has. Give that node a repository image.`); continue; }
        const missing = def.needs.filter(d => !has.includes(d));
        if (missing.length) err("image", `${c.type} on ${node} imports ${missing.join(", ")}, which ${image} does not install (it has ${has.join(", ") || "no Python package"}).`);
      }
    });
  }

  function validateSpec(spec, contract) {
    const out = [];
    const err = (step, msg) => out.push({ level: "error", step, msg });
    const warn = (step, msg) => out.push({ level: "warn", step, msg });
    const n = names(spec);

    // Identity
    if (!/^[a-z][a-z0-9]*(-[a-z0-9]+)*$/.test(n.name))
      err("identity", "The name is lowercase words joined by '-' (e.g. substation or grid-twin): it becomes a make target and, with '_', a Python package.");
    if (contract.scenarios[n.name] !== undefined)
      err("identity", `A scenario named '${n.name}' is already registered.`);
    if (!/^[a-z][a-z0-9_-]*$/.test(n.lab))
      err("identity", "The lab name is lowercase letters, digits, '-' or '_'.");
    if (Object.values(contract.scenarios).includes(n.lab))
      err("identity", `The lab name '${n.lab}' is taken: a deploy first removes any running lab of the same name, so two scenarios would undeploy each other.`);
    for (const t of makeTargets(spec)) if (contract.targets.includes(t))
      err("identity", `The make target '${t}' already exists: choose another name.`);
    if (!n.outDir.startsWith("output/"))
      warn("identity", "Runs outside output/ are not seen by the dashboard (make dashboard reads output/) nor removed by make clean.");
    if (!clean(spec.description))
      warn("identity", "Add a description: it opens the module docstrings, which say why the scenario exists.");

    if (isVariant(spec)) {
      const v = variantOf(spec), agent = agentOf(spec);
      if (!(contract.cps_hosts || []).some(h => h.name === v.host))
        err("image", `The cps lab has no host '${v.host}'.`);
      if (agent) {
        if (!/^[a-z][a-z0-9_]*$/.test(agent.module))
          err("image", "The agent's module name is lowercase letters, digits and '_' (it is imported bare in the container).");
        if (contract.guest_modules.includes(agent.module))
          err("image", `A guest module named '${agent.module}' already exists; two would land as /${agent.module}.py and the stale-twin guardrail fails.`);
        if (!contract.planes.includes(agent.plane)) err("image", `The plane is one of ${contract.planes.join(", ")}.`);
      }
      const seenOpt = new Set();
      for (const o of v.options || []) {
        const nm = String(o.name || "");
        if (!/^--[a-z][a-z0-9]*(-[a-z0-9]+)*$/.test(nm)) err("episode", `Option '${nm}': an option is '--' and lowercase words joined by '-' (e.g. --audit-interval).`);
        if ((contract.cps_options || []).includes(nm)) err("episode", `'${nm}' is already an option of the cps scenario or of the platform: argparse would refuse the second.`);
        if (seenOpt.has(nm)) err("episode", `Two options are named '${nm}'.`);
        seenOpt.add(nm);
      }
      validateComponents(spec, contract, err, warn, (contract.cps_hosts || []).map(h => h.name));
      if (!agent && !(v.options || []).length && !(spec.components || []).length)
        warn("episode", "The variant adds nothing yet: with no option, no agent and no component it is the cps scenario under another name.");
      return out;
    }

    // Topology
    const nodes = spec.nodes || [];
    if (!nodes.length) err("topology", "The lab has no nodes.");
    const seenNames = new Set();
    const byLink = {}; // link -> [{node, c}]
    const hostPorts = {};
    for (const node of nodes) {
      const nm = String(node.name || "");
      if (!/^[a-z][a-z0-9_]*$/.test(nm))
        err("topology", nm.includes("-")
          ? `Node '${nm}': Kathará refuses '-' in a machine name; use '_'.`
          : `Node '${nm || "(unnamed)"}': a name is lowercase letters, digits and '_', starting with a letter.`);
      if (seenNames.has(nm)) err("topology", `Two nodes are named '${nm}'.`);
      seenNames.add(nm);
      const ifs = node.ifaces || [];
      if (!ifs.length) warn("topology", `Node '${nm}' has no interface: it is reachable by nothing.`);
      ifs.forEach((f, i) => {
        if (!/^[A-Za-z0-9_]+$/.test(String(f.link || "")))
          err("topology", `${nm} eth${i}: a link name is letters, digits and '_'.`);
        const addrs = [];
        if (f.cidr) {
          const c = cidr(f.cidr);
          if (!c) err("topology", `${nm} eth${i}: '${f.cidr}' is not an address with its prefix (e.g. 10.0.0.2/24).`);
          else addrs.push(c);
          if (f.promisc) warn("topology", `${nm} eth${i}: a promiscuous NIC is meant to be passive; this one also gets an address.`);
        } else if (!f.promisc) {
          warn("topology", `${nm} eth${i} has no address: nothing on ${f.link} can reach it.`);
        }
        for (const a of f.aliases || []) {
          const c = cidr(a);
          if (!c) err("topology", `${nm} eth${i}: alias '${a}' is not an address with its prefix.`);
          else addrs.push(c);
        }
        for (const c of addrs) (byLink[f.link] = byLink[f.link] || []).push({ node: nm, c });
      });
      let defaults = 0;
      (node.routes || []).forEach(r => {
        if (r.dest === "default") defaults++;
        else if (!cidr(r.dest)) err("topology", `${nm}: route destination '${r.dest}' is neither 'default' nor a network (e.g. 10.1.0.0/24).`);
        const m = /^eth(\d+)$/.exec(String(r.dev || ""));
        if (!m || Number(m[1]) >= ifs.length) { err("topology", `${nm}: route via ${r.via} leaves from '${r.dev}', which the node does not have.`); return; }
        const via = ip4(r.via);
        if (via === null) { err("topology", `${nm}: '${r.via}' is not an IPv4 address.`); return; }
        const own = cidr(ifs[Number(m[1])].cidr);
        if (own && ((via & own.mask) >>> 0) !== own.net)
          warn("topology", `${nm}: the gateway ${r.via} is not on ${r.dev}'s network (${ifs[Number(m[1])].cidr}).`);
        const link = ifs[Number(m[1])].link;
        const owner = nodes.find(o => o !== node && (o.ifaces || []).some(f => f.link === link &&
          [f.cidr, ...(f.aliases || [])].some(a => { const c = cidr(a); return c && c.addr === via; })));
        if (!owner) warn("topology", `${nm}: no node on ${link} has the address ${r.via}, the route's gateway.`);
      });
      if (defaults > 1) err("topology", `${nm} has ${defaults} default routes: the second 'ip route add default' fails at boot.`);
      const ps = ports(node);
      for (const p of ps) {
        const m = /^(\d+):(\d+)\/(tcp|udp)$/.exec(p);
        if (!m) { err("topology", `${nm}: published port '${p}' is not HOST:GUEST/tcp (e.g. 8090:8080/tcp).`); continue; }
        if (hostPorts[m[1]]) err("topology", `Host port ${m[1]} is published by both ${hostPorts[m[1]]} and ${nm}.`);
        hostPorts[m[1]] = nm;
      }
      if (ps.length && (node.routes || []).some(r => r.dest === "default" && !r.replace))
        err("topology", `${nm} publishes a port and has a default route: tick 'replace' on it. The published port adds a bridged management NIC, which may already own a default route, and 'ip route add' would then fail.`);
    }
    for (const [link, entries] of Object.entries(byLink)) {
      const seen = {};
      for (const { node, c } of entries) {
        if (seen[c.addr] !== undefined)
          err("topology", `Address ${[c.addr >>> 24, (c.addr >> 16) & 255, (c.addr >> 8) & 255, c.addr & 255].join(".")} is taken twice on ${link} (${seen[c.addr]} and ${node}): whichever answers ARP first gets the other's traffic.`);
        seen[c.addr] = node;
      }
      const nets = new Set(entries.map(e => `${e.c.net}/${e.c.len}`));
      if (nets.size > 1) warn("topology", `The addresses on ${link} are not all on one network.`);
    }

    // Image
    const catalogue = Object.keys(contract.images);
    if (!(spec.image === "" || spec.image === NEW || catalogue.includes(spec.image)))
      err("image", `The lab's image '${spec.image}' is not one this repository builds.`);
    if (usesNewImage(spec)) for (const p of spec.newImagePackages || [])
      if (!contract.requirements[p]) err("image", `'${p}' has no pin in requirements.txt that a node image may use.`);

    // Guest agent
    const agent = agentOf(spec);
    if (agent) {
      const host = nodes.find(x => x.name === agent.node);
      if (!host) err("image", `The agent's node '${agent.node}' is not in the lab.`);
      else {
        const img = nodeImage(spec, host);
        if (imagePackages(spec, contract, img) === null)
          err("image", `The agent runs on ${agent.node}, whose image (${img || "Kathará's default"}) is not built here: nothing says what Python it has. Give that node a repository image.`);
      }
      if (!/^[a-z][a-z0-9_]*$/.test(agent.module))
        err("image", "The agent's module name is lowercase letters, digits and '_' (it is imported bare in the container).");
      if (contract.guest_modules.includes(agent.module))
        err("image", `A guest module named '${agent.module}' already exists; two would land as /${agent.module}.py and the stale-twin guardrail fails.`);
      if (!contract.planes.includes(agent.plane)) err("image", `The plane is one of ${contract.planes.join(", ")}.`);
      if (!(spec.phases || []).some(p => p.name === agent.phase))
        err("episode", `The agent starts in phase '${agent.phase}', which the episode does not have.`);
    }

    // Episode
    const phases = spec.phases || [];
    if (!phases.length) err("episode", "The episode has no phases.");
    const seenPh = new Set();
    for (const p of phases) {
      const nm = String(p.name || "");
      if (!/^[a-z][a-z0-9_]*$/.test(nm)) err("episode", `Phase '${nm}': a name is lowercase letters, digits and '_'.`);
      if (contract.reserved_phases.includes(nm)) err("episode", `'${nm}' is a phase of the core's own (${contract.reserved_phases.join(", ")}).`);
      if (seenPh.has(nm)) err("episode", `Two phases are named '${nm}'.`);
      seenPh.add(nm);
      if (!(Number(p.seconds) >= 0)) err("episode", `Phase '${nm}': its length is a number of seconds, 0 or more.`);
    }
    validateComponents(spec, contract, err, warn, nodes.map(x => String(x.name || "")));
    if (phases.length && !timedPhases(spec).length)
      warn("episode", "No phase is timed: a run will be as long as its setup, with nothing observed.");
    return out;
  }

  function makeTargets(spec) {
    const n = names(spec).name;
    return [n, `${n}-lab`, `${n}-dashboard`, ...(usesNewImage(spec) ? [`${n}-image`] : []), ...(hasCampaign(spec) ? [`${n}-campaign`] : [])];
  }

  // ── Files ─────────────────────────────────────────────────────────────────
  function docHead(fname, what, why) {
    return [`"""${fname} — ${what}`, "", ...why];
  }

  function initPy(spec, contract) {
    const n = names(spec), agent = agentOf(spec);
    const L = wrap(`${n.title}: ${lowerFirst(firstSentence(spec.description)) || (isVariant(spec) ? "a variant of the cps scenario." : "a scenario with a lab of its own.")}`, 76);
    L[0] = `"""${L[0]}`;
    const rest = clean(spec.description).slice(firstSentence(spec.description).length).trim();
    if (rest) L.push("", ...wrap(rest));
    L.push('"""', "",
      "# What this scenario adds, for the platform's code-size accounting",
      "# (python -m cyberrange.core loc). One directory per category, never two",
      "# categories over one file: loc sums them independently.");
    const sources = isVariant(spec)
      ? [["scenario (feature, options, CLI)", list([str(`cyberrange/scenarios/${n.pkg}/*.py`)])],
        ["dashboard panel", list([str(`cyberrange/scenarios/${n.pkg}/panel.js`)])]]
      : [["scenario (lab, episode, CLI, metrics)", list([str(`cyberrange/scenarios/${n.pkg}/*.py`)])],
        ...(hasPanel(spec) ? [["dashboard panel", list([str(`cyberrange/scenarios/${n.pkg}/panel.js`)])]] : [])];
    if (isVariant(spec)) L.push("# The lab, its nodes' software and the metrics are the cps scenario's and are", "# counted there, once.");
    L.push(...stmt(0, "SOURCES = ", coll("{", "}", sources.map(([k, v]) => atom(`${JSON.stringify(k)}: ${flat(v)}`)))));
    L.push(...stmt(0, "GUEST_MANIFESTS = ", tuple(Object.values(manifestsOf(spec, contract)).map(m => str(m.name)))));
    return L.join("\n") + "\n";
  }

  function topologyPy(spec, contract) {
    const n = names(spec), agent = agentOf(spec);
    const nodes = spec.nodes || [];
    const hasRoutes = nodes.some(x => (x.routes || []).length);
    const L = docHead("topology.py", `the ${n.name} lab, declared as data.`, []);
    const map = [];
    for (const link of linksOf(spec)) {
      const members = nodes.flatMap(x => (x.ifaces || []).filter(f => f.link === link)
        .map(f => f.cidr ? `${x.name} ${String(f.cidr).split("/")[0]}` : `${x.name} (passive)`));
      map.push(...wrap(`${link}: ${members.join(", ")}`, 92, "    "));
    }
    if (map.length) L.push(...map, "");
    L.push(...wrap("The core builds the Kathará lab from this (build_lab), writes it into every run as topology.json, and renders it offline as lab.conf (make lab-conf SCENARIO=" + n.name + "). Interface order fixes the NIC names, eth0 first."));
    L.push('"""', "");
    L.push(`from cyberrange.core.topology import ${["Iface", "Node", ...(hasRoutes ? ["Route"] : []), "Topology"].join(", ")}`);
    const manifests = manifestsOf(spec, contract);
    if (Object.keys(manifests).length) L.push(...fromImport(`cyberrange.scenarios.${n.pkg}.guest_files`, Object.values(manifests).map(m => m.name).sort()));
    L.push("", `LAB_NAME = ${JSON.stringify(n.lab)}`);
    L.push(n.image ? `IMAGE = ${JSON.stringify(n.image)}  # the image of every node that names none`
      : `IMAGE = ""  # Kathará's default image, for every node that names none`);
    L.push("", "", "def topology(args) -> Topology:");
    const nodeExprs = nodes.map(x => {
      const ifaces = (x.ifaces || []).map(f => {
        const a = [str(f.link)];
        if (f.cidr) a.push(str(f.cidr));
        if ((f.aliases || []).length) a.push(kw("aliases", list(f.aliases.map(str))));
        if (f.promisc) a.push(kw("promisc", atom("True")));
        return call("Iface", a);
      });
      const args = [str(x.name), list(ifaces)];
      if (x.image !== null && x.image !== undefined) args.push(kw("image", str(nodeImage(spec, x))));
      args.push(kw("role", str(x.role || "infra")));
      if ((x.routes || []).length) args.push(kw("routes", list(x.routes.map(r => call("Route",
        [str(r.dest), str(r.via), str(r.dev), ...(r.replace ? [kw("replace", atom("True"))] : [])])))));
      if (manifests[x.name]) args.push(kw("files", atom(manifests[x.name].name)));
      const ps = ports(x);
      if (ps.length) args.push(kw("mgmt_port", ps.length === 1 ? str(ps[0]) : list(ps.map(str))));
      return call("Node", args);
    });
    L.push(...stmt(4, "return ", call("Topology", [atom("LAB_NAME"), kw("default_image", atom("IMAGE")), kw("nodes", list(nodeExprs))])));
    return L.join("\n") + "\n";
  }

  function scenarioPy(spec, contract) {
    const n = names(spec), agent = agentOf(spec);
    const timed = timedPhases(spec), setup = setupPhases(spec);
    const L = docHead("scenario.py", `the ${n.name} scenario: its options, its lab and its episode.`, []);
    if (clean(spec.description)) L.push(...wrap(spec.description), "");
    L.push(...wrap("The core runs everything around the episode (ledger, deploy, artifacts, undeploy, exit code): this module says only what is this scenario's own."));
    L.push('"""', "");
    if (agent || hasPanel(spec)) L.push("import os", "");
    if (agent) L.push("from cyberrange.core.component import GuestAgent", "from cyberrange.core.context import seed_arg");
    L.push("from cyberrange.core.scenario import PhaseSpec, Scenario");
    for (const plane of planesUsed(spec, contract)) L.push(`from cyberrange.planes.${plane} import components as ${plane}`);
    L.push(`from cyberrange.scenarios.${n.pkg} import topology as T`);
    L.push(`from cyberrange.scenarios.${n.pkg}.metrics import compute_metrics`, "");
    if (setup.length) {
      L.push("# Planned length of the best-effort phases, for the ETA only: they last what they last.");
      L.push(...stmt(0, "SETUP_S = ", dict(setup.map(p => [p.name, atom(pyFloat(p.seconds))]))));
    }
    if (agent) {
      L.push("# Exit code of a run whose agent printed nothing: there is nothing to score.");
      L.push("EXIT_EMPTY_RUN = 3");
      L.push("# The placeholder agent: the node it runs on and its console log.");
      L.push(`AGENT_NODE = ${JSON.stringify(agent.node)}`, `AGENT_LOG = ${JSON.stringify(agent.module + ".log")}`);
    }
    L.push("", "", `class ${n.cls}(Scenario):`);
    L.push(`    name = ${JSON.stringify(n.name)}`, "    lab_name = T.LAB_NAME", `    DEFAULT_OUT_DIR = ${JSON.stringify(n.outDir)}`);
    L.push("", "    def add_arguments(self, ap):", `        g = ap.add_argument_group(${JSON.stringify(n.name + " scenario")})`);
    L.push(...stmt(8, "", call("g.add_argument", [str("--out-dir"), kw("default", atom("self.DEFAULT_OUT_DIR")), kw("help", str("where the run writes"))])));
    for (const p of timed)
      L.push(...stmt(8, "", call("g.add_argument", [str(optName(p.name)), kw("type", atom("float")),
        kw("default", atom(pyFloat(p.seconds))), kw("help", str(`seconds of the ${p.name} phase`))])));
    if (timed.length) {
      L.push("", "    def validate(self, args):");
      L.push("        # A negative length would leave the ETA and ctx.observe disagreeing.");
      L.push(...stmt(8, "for opt in ", tuple(timed.map(p => str(optAttr(p.name)))), ":"));
      L.push("            if getattr(args, opt) < 0:");
      L.push(`                raise SystemExit(f"--{opt.replace('_', '-')} must be >= 0")`);
    }
    L.push("", "    def topology(self, args):", "        return T.topology(args)");
    L.push("", "    def episode_phases(self, args):");
    L.push(...stmt(8, "return ", list((spec.phases || []).map(p => p.timed
      ? call("PhaseSpec", [str(p.name), atom(`float(args.${optAttr(p.name)})`), kw("timed", atom("True"))])
      : call("PhaseSpec", [str(p.name), atom(`SETUP_S[${JSON.stringify(p.name)}]`)])))));
    L.push("", "    def episode(self, ctx):");
    if (timed.length || usesArgs(spec, contract)) L.push("        a = ctx.args");
    for (const p of spec.phases || []) {
      L.push(`        with ctx.phase(${JSON.stringify(p.name)}):`);
      let body = 0;
      for (const c of componentsOf(spec, contract).filter(c => c.phase === p.name)) { L.push(...componentLines(contract, c, 12)); body++; }
      if (agent && agent.phase === p.name) {
        L.push("            # The placeholder agent: replace it with what this scenario runs.");
        L.push(`            seed = seed_arg(ctx.role_seed(${JSON.stringify(agent.module)}))`);
        L.push(`            command = f"python3 ${agent.module}.py --interval 1{seed}"`);
        L.push(...stmt(12, "", call("ctx.start", [call("GuestAgent", [atom("AGENT_NODE"), atom("command"), atom("AGENT_LOG"), kw("plane", str(agent.plane))])])));
        body++;
      }
      if (p.timed) { L.push(`            ctx.observe(a.${optAttr(p.name)})`); body++; }
      if (!body) L.push("            # Start this phase's components here, with ctx.start(component).", "            pass");
    }
    if (agent) {
      L.push("", "    def check_run(self, ctx):");
      L.push("        # The core downloads a console log as <node>.<log> into the run directory.");
      L.push('        log = ctx.path(f"{AGENT_NODE}.{AGENT_LOG}")');
      L.push("        if not os.path.exists(log) or os.path.getsize(log) == 0:");
      L.push("            return EXIT_EMPTY_RUN", "        return 0");
    }
    L.push("", "    def metrics(self, run_dir):", "        return compute_metrics(run_dir)");
    if (hasPanel(spec)) L.push("", "    def panel_js(self):", '        return os.path.join(os.path.dirname(os.path.abspath(__file__)), "panel.js")');
    return L.join("\n") + "\n";
  }

  function cliPy(spec) {
    const n = names(spec);
    const L = docHead("cli.py", `the command line of one ${n.name} run.`, []);
    L.push(...wrap((isVariant(spec) ? "The scenario is the cps one with what feature.py adds (scenario.py)" : "The scenario itself lives in scenario.py and topology.py") + ", the run lifecycle in cyberrange/core. run() is what tests and campaigns call; main() is the command line."));
    // Two lines, as a shell takes them: one would pass 100 columns with a long name.
    L.push("", "Run:", `    python -m ${n.module}${isVariant(spec) ? " --attack" : ""} \\`, `        --out-dir ${n.outDir} --seed 1`, '"""', "");
    L.push("from cyberrange.core import cli, lifecycle", `from cyberrange.scenarios.${n.pkg}.scenario import ${n.cls}`, "", "");
    L.push("def run(args, progress=None, manager=None):");
    L.push(`    """One ${n.name} run (see core.lifecycle.run); \`\`progress\`\` is a campaign's`);
    L.push(`    bound ledger emitter, or None for the run's own <out_dir>/progress.jsonl."""`);
    L.push(`    return lifecycle.run(${n.cls}(), args, progress=progress, manager=manager)`, "", "");

    L.push("", "", `class ${featureCls(spec)}(Feature):`);
    let body = 0;
    if ((v.options || []).length) {
      L.push("    def add_arguments(self, ap):", `        g = ap.add_argument_group(${JSON.stringify(n.name)})`);
      for (const o of v.options)
        L.push(...stmt(8, "", call("g.add_argument", [str(o.name), kw("default", str(o.default)), kw("help", str(clean(o.help) || "(describe this option)"))])));
      body++;
    }
    if (Object.keys(manifests).length) {
      if (body) L.push("");
      L.push("    def extras(self, spec, args):");
      L.push("        # spec.host fails here, before anything deploys, in a lab without the host.");
      L.push(...stmt(8, "return ", coll("{", "}", Object.entries(manifests).map(([node, m]) =>
        atom(`spec.host(${JSON.stringify(node)}).name: T.Extra(files=${m.name})`)))));
      body++;
    }
    if (agent || comps.length) {
      if (body) L.push("");
      L.push("    def services(self, ctx):");
      L.push("        # Started with the lab's services, before normal operation.");
      if (usesArgs(spec, contract)) L.push("        a = ctx.args");
      if (agent) {
        L.push("        # The placeholder agent: replace it with what this scenario runs.");
        L.push(`        seed = seed_arg(ctx.role_seed(${JSON.stringify(agent.module)}))`);
        L.push(`        command = f"python3 ${agent.module}.py --interval 1{seed}"`);
        L.push(...stmt(8, "", call("ctx.start", [call("GuestAgent", [atom("AGENT_HOST"), atom("command"), atom("AGENT_LOG"), kw("plane", str(agent.plane))])])));
      }
      for (const c of comps) L.push(...componentLines(contract, c, 8));
      body++;
    }
    if (!body) L.push('    """Nothing yet: implement the hooks of what this scenario adds."""');
    return L.join("\n") + "\n";
  }

  function variantScenarioPy(spec) {
    const n = names(spec);
    const L = docHead("scenario.py", `the cps scenario with what ${n.name} adds.`, []);
    L.push(...wrap("The same lab and the same episode as cyberrange/scenarios/cps; what differs is in feature.py. A scenario of its own, and not an option of cps, so that under its own name and lab name it runs side by side with cps and its runs are told apart."));
    L.push('"""', "", "import os", "", "from cyberrange.scenarios.cps.scenario import CpsScenario");
    L.push(`from cyberrange.scenarios.${n.pkg}.feature import ${featureCls(spec)}`, "", `LAB_NAME = ${JSON.stringify(n.lab)}`, "", "");
    L.push(`class ${n.cls}(CpsScenario):`, `    name = ${JSON.stringify(n.name)}`, "    lab_name = LAB_NAME", `    features = (${featureCls(spec)}(),)`);
    L.push(`    DEFAULT_OUT_DIR = ${JSON.stringify(n.outDir)}`, "", "    def panel_js(self):");
    L.push('        return os.path.join(os.path.dirname(os.path.abspath(__file__)), "panel.js")');
    return L.join("\n") + "\n";
  }

  function variantTestPy(spec, contract) {

    L.push(...wrap("The lab and the episode are the cps scenario's and are tested there; this checks what the variant adds, without Docker: its name and lab, its options, what it stages and what it starts."));
    L.push("", `Run: \`.venv/bin/python -m pytest tests/scenarios/${n.pkg} -q\``, '"""', "", "import unittest", "");
    L.push("from cyberrange.core.cli import default_args");
    if (agent) L.push(`from cyberrange.scenarios.${n.pkg}.feature import AGENT_HOST, ${featureCls(spec)}`);
    L.push(`from cyberrange.scenarios.${n.pkg}.scenario import ${n.cls}`);
    if (agent) {
      L.push("", "", "class _Ctx:", '    """What a feature\'s services hook uses of the run context, recorded."""', "");
      L.push("    def __init__(self, scenario, args):", "        self.scenario, self.args, self.started = scenario, args, []", "");

      [], `MIN_TESTS = <current + ${isVariant(spec) ? variantTestCount(spec) : testCount(spec)}>`);

  function generateScenario(spec, contract) {
    const n = names(spec), agent = agentOf(spec);
    const files = [];
    // An optional block left out can leave three blank lines where ruff keeps two.
    const tidy = (lang, s) => lang === "python" ? s.replace(/\n{4,}/g, "\n\n\n") : s;
    const add = (path, step, lang, content) => files.push({ path, step, lang, content: tidy(lang, content) });
    const base = `cyberrange/scenarios/${n.pkg}`;
    if (isVariant(spec)) {
      add(`${base}/guest_files.py`, "image", "python", guestFilesPy(spec, contract));
      if (agent) add(`nodes/${n.pkg}/${agent.module}.py`, "image", "python", agentPy(spec, contract));
      add(`${base}/feature.py`, "episode", "python", featurePy(spec, contract));
      add(`${base}/scenario.py`, "package", "python", variantScenarioPy(spec));
      add(`${base}/__init__.py`, "package", "python", initPy(spec, contract));
      add(`${base}/cli.py`, "package", "python", cliPy(spec, contract));
      add(`${base}/panel.js`, "package", "javascript", variantPanelJs(spec));
      add(`make/${n.name}.mk`, "make", "makefile", variantMakeMk(spec));
      add(`tests/scenarios/${n.pkg}/__init__.py`, "tests", "python", "");
      add(`tests/scenarios/${n.pkg}/test_${n.pkg}_scenario.py`, "tests", "python", variantTestPy(spec, contract));
      if (spec.docsPage) add(`docs/scenario-${n.name}.md`, "finish", "markdown", variantDocsMd(spec, contract));
      const list = edits(spec, contract);
      return { names: n, files, edits: list, editsFile: editsFile(spec, list), preview: [], tests: variantTestCount(spec), targets: makeTargets(spec) };
    }
    add(`${base}/topology.py`, "topology", "python", topologyPy(spec, contract));
    add(`${base}/guest_files.py`, "image", "python", guestFilesPy(spec, contract));
    if (agent) add(`nodes/${n.pkg}/${agent.module}.py`, "image", "python", agentPy(spec, contract));
    if (usesNewImage(spec)) add(`docker/${n.name}/Dockerfile`, "image", "dockerfile", dockerfile(spec, contract));
    add(`${base}/scenario.py`, "episode", "python", scenarioPy(spec, contract));
    add(`${base}/__init__.py`, "package", "python", initPy(spec, contract));
    add(`${base}/cli.py`, "package", "python", cliPy(spec, contract));
    add(`${base}/metrics.py`, "metrics", "python", metricsPy(spec, contract));
    if (hasCampaign(spec)) add(`${base}/campaign.py`, "metrics", "python", campaignPy(spec));
    if (hasPanel(spec)) add(`${base}/panel.js`, "metrics", "javascript", panelJs(spec));
    add(`make/${n.name}.mk`, "make", "makefile", makeMk(spec, contract));
    add(`tests/scenarios/${n.pkg}/__init__.py`, "tests", "python", "");
    add(`tests/scenarios/${n.pkg}/test_${n.pkg}_scenario.py`, "tests", "python", testPy(spec, contract));
    if (spec.docsPage) add(`docs/scenario-${n.name}.md`, "finish", "markdown", docsMd(spec, contract));
    const list = edits(spec, contract);
    return { names: n, files, edits: list, editsFile: editsFile(spec, list), preview: labConf(spec, contract), tests: testCount(spec), targets: makeTargets(spec) };
  }

  // ── What Kathará is given ─────────────────────────────────────────────────
  // lab.conf and the startup files as core.topology.export_lab_conf renders
  // them (make lab-conf), for the page to show before anything is written. The
  // logic is the core's, repeated: the test compares the two on the skeleton.
  function startupCommands(node) {
    const ifs = node.ifaces || [], cmds = [];
    ifs.forEach((f, i) => { if (f.promisc) cmds.push(`ip link set eth${i} promisc on`, `ip link set eth${i} up`); });
    ifs.forEach((f, i) => { if (f.cidr) cmds.push(`ip address add ${f.cidr} dev eth${i}`); });
    for (const r of node.routes || []) cmds.push(`ip route ${r.replace ? "replace" : "add"} ${r.dest} via ${r.via} dev ${r.dev}`);
    ifs.forEach((f, i) => { for (const a of f.aliases || []) cmds.push(`ip address add ${a} dev eth${i}`); });
    return cmds;
  }
  function labConf(spec, contract) {
    const n = names(spec), manifests = manifestsOf(spec, contract);
    const lines = [`LAB_DESCRIPTION="${n.lab}"`, ""], startups = [];
    for (const x of spec.nodes || []) {
      (x.ifaces || []).forEach((f, i) => lines.push(`${x.name}[${i}]="${f.link}"`));
      const image = nodeImage(spec, x);
      if (image) lines.push(`${x.name}[image]="${image}"`);
      const ps = ports(x);
      if (ps.length) lines.push(`${x.name}[bridged]="true"`, ...ps.map(p => `${x.name}[port]="${p}"`));
      for (const [host, guest] of (manifests[x.name] || { entries: [] }).entries) lines.push(`# ${x.name}: ${guest} <- ${host}`);
      lines.push("");
      startups.push({ path: `${x.name}.startup`, lang: "bash", content: startupCommands(x).join("\n") + "\n" });
    }
    return [{ path: "lab.conf", lang: "ini", content: lines.join("\n") }, ...startups];
  }

  // ── The answers as a file ─────────────────────────────────────────────────
  const SPEC_KIND = "cyberrange-scenario-spec", SPEC_VERSION = 1;
  const blankSpec = () => ({
    kind: "lab", variant: { host: "hmi", options: [] }, components: [], campaign: false, panel: false,
    name: "", title: "", description: "", lab: "", outDir: "", image: "kathara/cps", newImagePackages: [],
    nodes: [{ name: "node1", role: "target", image: null, mgmtPort: "", ifaces: [{ link: "A", cidr: "10.0.0.1/24", aliases: [], promisc: false }], routes: [] }],
    phases: [{ name: "setup", timed: false, seconds: 2 }, { name: "observe", timed: true, seconds: 30 }],
    agent: { enabled: false, node: "node1", module: "agent", phase: "setup", plane: "monitor" },
    docsPage: true,
  });
  const exportSpec = spec => ({ kind: SPEC_KIND, version: SPEC_VERSION, spec: JSON.parse(JSON.stringify(spec)) });
  // A file from elsewhere becomes the page's state: every field is rebuilt with
  // its type, so that a hand-edited or damaged file cannot leave the form with
  // a value it cannot show. What the file leaves out takes the blank default.
  function importSpec(doc) {
    if (!doc || typeof doc !== "object" || doc.kind !== SPEC_KIND)
      throw new Error("This is not a file exported from the scenario guide.");
    if (doc.version !== SPEC_VERSION)
      throw new Error(`The file is version ${doc.version}; this guide reads version ${SPEC_VERSION}.`);
    const src = doc.spec;
    if (!src || typeof src !== "object" || !Array.isArray(src.nodes) || !Array.isArray(src.phases))
      throw new Error("The file has no scenario in it: its nodes and phases are missing.");
    const b = blankSpec();
    const S = v => String(v == null ? "" : v);
    const A = v => (Array.isArray(v) ? v : []);
    const O = v => (v && typeof v === "object" ? v : {});

        options: A(O(src.variant).options).map(O).map(o => ({ name: S(o.name), default: S(o.default), help: S(o.help) })) },
      components: A(src.components).map(O).map(c => ({ type: S(c.type), phase: S(c.phase),
        args: Object.fromEntries(Object.entries(O(c.args)).map(([k, v]) => [S(k), S(v)])) })),
      campaign: !!src.campaign, panel: !!src.panel,
      name: S(src.name), title: S(src.title), description: S(src.description), lab: S(src.lab), outDir: S(src.outDir),
      image: src.image == null ? b.image : S(src.image),
      newImagePackages: A(src.newImagePackages).map(S),
      nodes: src.nodes.map(O).map(x => ({
        name: S(x.name), role: S(x.role || "infra"), image: x.image == null ? null : S(x.image), mgmtPort: S(x.mgmtPort),
        ifaces: A(x.ifaces).map(O).map(f => ({ link: S(f.link), cidr: S(f.cidr), aliases: A(f.aliases).map(S), promisc: !!f.promisc })),
        routes: A(x.routes).map(O).map(r => ({ dest: S(r.dest || "default"), via: S(r.via), dev: S(r.dev || "eth0"), replace: !!r.replace })),
      })),
      phases: src.phases.map(O).map(q => ({ name: S(q.name), timed: !!q.timed, seconds: Number(q.seconds) || 0 })),
      agent: { enabled: !!a.enabled, node: S(a.node || b.agent.node), module: S(a.module || b.agent.module),

    lab: "substation",
    outDir: "output/substation/run-1",
    image: "kathara/cps",
    newImagePackages: ["numpy"],
    nodes: [

        ifaces: [{ link: "FIELD", cidr: "10.10.0.2/24", aliases: [], promisc: false }],
        routes: [{ dest: "default", via: "10.10.0.1", dev: "eth0", replace: false }] },
      { name: "gateway", role: "infra", image: null, mgmtPort: "",

        routes: [{ dest: "default", via: "10.20.0.1", dev: "eth0", replace: true }] },
      { name: "probe", role: "defender", image: null, mgmtPort: "",

      { name: "setup", timed: false, seconds: 2 },

  // The worked example of a variant: the cps lab with an agent on the HMI.
  const EXAMPLE_VARIANT = Object.assign(blankSpec(), {
    kind: "variant",
    name: "cps-audit",
    title: "CPS audit",

<script>
// BEGIN view
// view(state, contract): what the page shows, as HTML strings computed from the
// state alone. No DOM here, so tests/core/test_scenario_guide.py renders every
// step under node; the script below only puts the strings on the page.
(function (root) {
  "use strict";
  const G = root.ScenarioGuide;
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const md = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");

  const STEPS = [
    { id: "start", title: "Before you start", checks: [
      ["green", "The suite is green before any change (`make selftest-fast`)."],
      ["contract", "I have read the scenario contract (docs/platform.md, section 2)."],
      ["ownlab", "The scenario needs a lab of its own: it is not a variant of the CPS lab."]] },
    { id: "identity", title: "Name it", checks: [
      ["dash", "The name's first word appears nowhere in the dashboard's sources (the grep below prints nothing)."],
      ["lab", "No other lab of mine, in this repository or elsewhere on this machine, uses the lab name."]] },
    { id: "topology", title: "Declare the lab", checks: [
      ["addr", "Every node has the addresses and routes it needs, and the graph shows the lab I mean."],
      ["ports", "Published ports are free on the host that will run the lab."]] },
    { id: "image", title: "Image and guest files", checks: [
      ["imports", "Every package the guest code imports is installed by its node's image."],
      ["guestpath", "The guest paths are final: other files will import them by these names."],
      ["tool", "Where an existing open-source tool does a node's job, the image installs it and nodes/ configures it."]] },
    { id: "episode", title: "Write the episode", checks: [
      ["seed", "Every component that takes a seed gets `ctx.role_seed(...)`."],
      ["check", "`check_run` returns non-zero for a run with nothing to score."],
      ["eta", "Each phase's planned length is honest: the dashboard's ETA is built on it."]] },
    { id: "package", title: "Package and registry", checks: [
      ["registered", "`python -m cyberrange.core scenarios` lists the scenario."],
      ["loc", "`make platform-loc` counts the new files under the scenario."]] },
    { id: "metrics", title: "Score a run", checks: [
      ["flat", "`compute_metrics` returns a flat dict of numbers, from the run directory alone."]] },
    { id: "make", title: "Make targets", checks: [
      ["dry", "`make -n <name>` prints the run command."],
      ["help", "`make help` lists the new targets."]] },
    { id: "tests", title: "Tests and guardrails", checks: [
      ["own", "The scenario's own tests pass."],
      ["registry", "test_registry and test_guest_imports know the scenario (the script's edits, applied in the last step)."],
      ["snap", "The snapshots were regenerated on purpose: a new lab file, a new key, and `platform` one line larger."],
      ["min", "MIN_TESTS is raised by the tests added."]] },
    { id: "verify", title: "Verify and run", checks: [
      ["labconf", "`make lab-conf` renders the lab I expect."],
      ["check", "`make check` passes: lint, the suite and a dry run of every target."],
      ["real", "A real run deployed, ran its phases, wrote its artifacts and undeployed."]] },
    { id: "finish", title: "Download and document", checks: [
      ["applied", "`tools/apply_scenario_edits.py` reports every edit in place, and `scenario-edits.json` is removed."],
      ["docs", "The scenario has its page in docs/ and in the nav."],
      ["commit", "The change is formatted (`make fmt`) and committed on a branch."]] },
  ];
  // A variant keeps the steps and their order; four of them are about other things.
  const VARIANT_STEPS = {
    topology: { title: "The lab it builds on", checks: [
      ["fits", "The cps lab as it is fits what I want to add, or I know which hook changes it (`nodes`, `lab_spec`)."]] },
    image: { title: "Guest files", checks: [
      ["imports", "Every package the guest code imports is installed by the image of the host it runs on."],
      ["guestpath", "The guest paths are final, and none is a name the cps lab already stages."],
      ["tool", "Where an existing open-source tool does the job, the image installs it and nodes/ configures it."]] },
    episode: { title: "What it adds", checks: [
      ["hooks", "Everything the variant adds is in the feature's hooks: scenario.py only lists the feature."],
      ["seed", "Every component that takes a seed gets `ctx.role_seed(...)`."]] },
    metrics: { title: "Score a run", checks: [
      ["inherit", "The cps metrics score what this variant is about, or I know what `metrics()` must add."]] },
  };
  const stepsFor = spec => STEPS.map(s => (spec && spec.kind === "variant" && VARIANT_STEPS[s.id] ? Object.assign({}, s, VARIANT_STEPS[s.id]) : s));
  const stepIndex = id => STEPS.findIndex(s => s.id === id);

  function view(state, CONTRACT) {
  const N = () => G.names(state.spec);
  const steps = stepsFor(state.spec), variant = G.isVariant(state.spec);
  const issues = G.validateSpec(state.spec, CONTRACT);
  let gen;
  try { gen = G.generateScenario(state.spec, CONTRACT); }
  catch (e) { gen = { files: [], edits: [], preview: [], tests: 0, targets: [], error: e }; }

  function highlight(code, lang) {
    if (root.hljs && lang && root.hljs.getLanguage(lang)) {
      try { return root.hljs.highlight(code, { language: lang, ignoreIllegals: true }).value; } catch (e) { /* fall through */ }
    }
    return esc(code);
  }
  function codeBox(code, lang, path) {
    return `<div class="codebox"><div class="tools"><button data-copy="${esc(path || "")}" data-code>Copy</button>${path ? `<button data-dl="${esc(path)}">Save</button>` : ""}</div>` +
      `<pre><code>${highlight(code, lang)}</code></pre><textarea hidden>${esc(code)}</textarea></div>`;
  }

  function filesCard(stepId) {
    const files = gen.files.filter(f => f.step === stepId);
    if (!files.length) return "";
    const cur = files.find(f => f.path === state.tab[stepId]) || files[0];
    return `<section class="card"><h3>Files this step writes</h3>
      <div class="tabs" role="tablist">${files.map(f => `<button role="tab" data-tab="${esc(f.path)}" data-step="${stepId}" aria-selected="${f === cur}">${esc(f.path)}</button>`).join("")}</div>
      ${codeBox(cur.content || "# (empty file: it makes the directory a package)\n", cur.lang, cur.path)}</section>`;
  }
  function editsCard(stepId) {
    const eds = gen.edits.filter(e => e.step === stepId);
    if (!eds.length) return "";
    return `<section class="card"><h3>Edits to files that exist</h3>
      <p class="sub" style="margin-bottom:10px">Those marked <span class="pill">script</span> are applied for you by <code>tools/apply_scenario_edits.py</code> in the last step; those marked <span class="pill">by hand</span> are deliberate acts and stay yours.</p>${eds.map(e => `<div class="edit">
      <div><span class="path mono">${esc(e.file)}</span> · ${esc(e.title)} <span class="pill">${e.ops.length ? "script" : "by hand"}</span></div><p class="note">${md(e.note)}</p>${codeBox(e.text, e.lang)}</div>`).join("")}</section>`;
  }
  function issuesList(stepId) {
    const mine = issues.filter(i => i.step === stepId);
    if (!mine.length) return stepId === "start" || stepId === "verify" || stepId === "finish" ? "" : `<ul class="issues"><li class="ok">Nothing to fix in this step.</li></ul>`;
    return `<ul class="issues">${mine.map(i => `<li class="${i.level}">${i.level === "error" ? "<strong>Fix:</strong> " : "<strong>Check:</strong> "}${md(i.msg)}</li>`).join("")}</ul>`;
  }
  function checklist(step) {
    const done = state.checks[step.id] || {};
    const n = N();
    return `<section class="card"><h3>Checklist</h3><ul class="checklist">${step.checks.map(([id, text]) =>
      `<li><input type="checkbox" id="ck-${step.id}-${id}" data-check="${step.id}.${id}" ${done[id] ? "checked" : ""}><label for="ck-${step.id}-${id}">${md(text.replace(/<name>/g, n.name || "<name>"))}</label></li>`).join("")}</ul></section>`;
  }
  const field = (label, path, value, hint = "", attrs = "") =>
    `<div class="field"><label>${label}</label><input type="text" data-path="${path}" value="${esc(value)}" ${attrs}>${hint ? `<div class="hint">${hint}</div>` : ""}</div>`;

  function imageOptions(value, withDefault) {
    const n = N();
    const opts = [];
    if (withDefault) opts.push(["__default", "the lab's image"]);
    opts.push(["", "Kathará's default (no repository image)"]);
    for (const img of Object.keys(CONTRACT.images)) opts.push([img, img]);
    opts.push([G.NEW, `kathara/${n.name || "<name>"} (new, built here)`]);
    const v = value === null || value === undefined ? "__default" : value;
    return opts.map(([k, l]) => `<option value="${esc(k)}" ${k === v ? "selected" : ""}>${esc(l)}</option>`).join("");
  }

  // ── Step bodies ───────────────────────────────────────────────────────────
  const BODY = {
    start() {
      return `<p class="lead">A scenario is one directory, whole: <code>cyberrange/scenarios/&lt;name&gt;/</code>. The core runs every scenario the same way — ledger, deploy, episode, download, undeploy, exit code — and the scenario declares only what is its own: the lab, its options, its episode and its score.</p>
      <section class="card prose"><h3>What this guide builds</h3>
      <p>A scenario with a lab of its own, as <code>mqtt-mtd</code> has: a <code>Topology</code>, an episode, a command line, a deploy manifest, metrics, make targets, tests and a docs page. Each step explains one part and shows the file it writes, filled from your answers; the last step downloads them all as a zip to unpack at the repository root.</p>
      <p>The guide also builds the other kind: a <strong>variant of the cps lab</strong>, as <code>cps-recon</code> and <code>cps-advisor</code> are. It keeps the cps lab and episode and adds a <code>Feature</code> to them. You choose which in the next step; <a href="extending/">Extending the platform</a> says when each fits.</p></section>
      <section class="card"><h3>The rules a new scenario meets</h3><ol class="rules">
      <li><strong>Imports point one way:</strong> <code>core ← planes ← scenarios</code>, and <code>nodes/</code> neither imports nor is imported by <code>cyberrange/</code>. A plane that imports a scenario can serve only that scenario: pass what is specific in as a constructor argument. <span class="pill">test_layering.py</span></li>
      <li><strong>A guest path is a contract; a host path is free.</strong> Files copied into containers import each other bare, so <code>/probe_agent.py</code> keeps that name for good. <span class="pill">test_deploy_contract.py</span></li>
      <li><strong>Guest code imports only the stdlib and what its node image installs</strong>, never <code>cyberrange.*</code>: it runs where this repository and its virtualenv do not exist. <span class="pill">test_guest_imports.py</span></li>
      <li><strong><code>SOURCES</code> categories stay disjoint</strong>, one directory each: a file matched twice is counted twice in the paper's table. <span class="pill">test_loc_coverage.py</span></li>
      <li><strong>Never make a guardrail green without understanding it:</strong> no hand edits under <code>tests/snapshots/</code>, no reflexive <code>UPDATE_SNAPSHOTS=1</code>, never a lower <code>MIN_TESTS</code>.</li>
      <li><strong>make target names and <code>-m</code> module paths are internal API:</strong> campaigns shell out to them.</li>
      <li><strong>No new top-level directories, and never <code>pip install -e .</code></strong>: an installed copy shadows the sources and makes the tests pass for the wrong reason.</li>
      </ol></section>
      <section class="card"><h3>Set up</h3>${codeBox(`python3 -m venv .venv && .venv/bin/pip install -r requirements.txt
.venv/bin/python -m cyberrange.core scenarios   # what is registered today
make selftest-fast                              # a green suite before you start`, "bash")}
      <p class="sub" style="margin-top:8px">Want to see a finished answer first? <strong>Load example</strong> (top right) fills every step with a small substation lab.</p></section>`;
    },

    identity() {
      const s = state.spec, n = N();
      const first = (n.name || "").split("-")[0] || "<word>";
      return `<p class="lead">The name is the registry key and the prefix of the make targets; with <code>-</code> turned into <code>_</code> it is the Python package. The lab name is what Kathará deploys: a deploy first removes any running lab of that name, so no two scenarios may share one.</p>
      <section class="card"><h3>What kind of scenario</h3>
        <label class="inline" style="display:flex;align-items:flex-start;gap:8px;margin-bottom:8px;font-size:14px;color:var(--ink)"><input type="radio" name="kind" value="lab" data-path="kind" ${variant ? "" : "checked"} style="margin-top:4px"><span><strong>A lab of its own.</strong> Its own nodes, networks and episode, as <code>mqtt-mtd</code> has. Choose it when the experiment is not about the cps plant.</span></label>
        <label class="inline" style="display:flex;align-items:flex-start;gap:8px;font-size:14px;color:var(--ink)"><input type="radio" name="kind" value="variant" data-path="kind" ${variant ? "checked" : ""} style="margin-top:4px"><span><strong>A variant of the cps lab.</strong> The cps lab, plant, attack and SOC, plus what you add: options, software on a host, services. Choose it when the experiment changes one thing about cps.</span></label>
      </section>
      <section class="card"><div class="form">
        ${field("Scenario name", "name", s.name, "lowercase words joined by '-'", variant ? 'placeholder="cps-audit"' : 'placeholder="substation"')}
        ${field("Title", "title", s.title, "for people: make help, the docs page", 'placeholder="Substation gateway"')}
        ${field("Lab name", "lab", s.lab, `Kathará's; empty = ${esc(n.pkg || "the package name")}`)}
        ${field("Default output directory", "outDir", s.outDir, `empty = output/${esc(n.name || "<name>")}/run-1`)}
        <div class="field wide"><label>Description</label><textarea data-path="description" placeholder="What the lab is and what the scenario is for. It opens the docstrings, which say why the code exists.">${esc(s.description)}</textarea></div>
      </div></section>
      ${issuesList("identity")}
      <section class="card"><h3>What the name becomes</h3><table>
        <tr><th>Package</th><td><code>cyberrange/scenarios/${esc(n.pkg)}/</code></td></tr>
        <tr><th>Class</th><td><code>${esc(n.cls)}</code> in <code>scenario.py</code></td></tr>
        <tr><th>Kathará lab</th><td><code>${esc(n.lab)}</code></td></tr>
        <tr><th>Entry point</th><td><code>python -m ${esc(n.module)}</code>, named once in make as <code>${esc(n.makeVar)}</code></td></tr>
        <tr><th>make targets</th><td>${G.makeTargets(s).map(t => `<code>${esc(t)}</code>`).join(" ")}</td></tr>
        <tr><th>Runs</th><td><code>${esc(n.outDir)}</code></td></tr>
      </table></section>
      <section class="card prose"><h3>One name the dashboard must not say</h3>
      <p>The dashboard is platform code and names no scenario: <code>tests/core/test_dashboard.py</code> fails if the name, its <code>_</code> form or <strong>its first <code>-</code>-separated word</strong> appears as a word in a non-comment line of the dashboard's sources. A first word such as <code>grid</code>, <code>run</code> or <code>attack</code> is likely to be there already. This must print nothing:</p>
      ${codeBox(`grep -nwi -e '${n.name || "<name>"}' -e '${n.pkg || "<name>"}' -e '${first}' cyberrange/core/dashboard.html cyberrange/core/dashboard.py cyberrange/core/ledgers.py`, "bash")}</section>`;
    },

    topology() {
      const s = state.spec;
      const nodes = s.nodes.map((nd, i) => {
        const p = `nodes.${i}`;
        const ifs = (nd.ifaces || []).map((f, j) => `<div class="row">
          <span class="mono">eth${j}</span>
          <input type="text" class="narrow" data-path="${p}.ifaces.${j}.link" value="${esc(f.link)}" placeholder="link" title="link (collision domain)">
          <input type="text" data-path="${p}.ifaces.${j}.cidr" value="${esc(f.cidr)}" placeholder="10.0.0.2/24" title="primary address">
          <input type="text" data-path="${p}.ifaces.${j}.aliases" data-type="csv" value="${esc((f.aliases || []).join(", "))}" placeholder="aliases, comma-separated" title="extra addresses">
          <label class="inline"><input type="checkbox" data-path="${p}.ifaces.${j}.promisc" data-type="bool" ${f.promisc ? "checked" : ""}> passive (promisc)</label>
          <button class="ghost" data-act="del-iface" data-i="${i}" data-j="${j}" title="remove">✕</button></div>`).join("");
        const devs = (nd.ifaces || []).map((_, j) => `eth${j}`);
        const routes = (nd.routes || []).map((r, j) => `<div class="row">
          <input type="text" class="narrow" data-path="${p}.routes.${j}.dest" value="${esc(r.dest)}" placeholder="default" title="destination">
          via <input type="text" data-path="${p}.routes.${j}.via" value="${esc(r.via)}" placeholder="gateway address">
          dev <select data-path="${p}.routes.${j}.dev">${devs.map(d => `<option ${d === r.dev ? "selected" : ""}>${d}</option>`).join("")}</select>
