          <button class="ghost" data-act="del-route" data-i="${i}" data-j="${j}" title="remove">✕</button></div>`).join("");
        return `<div class="nodecard"><div class="row">
          ${field("Node", `${p}.name`, nd.name)}
          <div class="field"><label>Role</label><input type="text" list="roles" data-path="${p}.role" value="${esc(nd.role)}"></div>
          <div class="field"><label>Image</label><select data-path="${p}.image" data-type="image">${imageOptions(nd.image, true)}</select></div>
          ${field("Published ports", `${p}.mgmtPort`, nd.mgmtPort, "", 'placeholder="none, or 8090:8080/tcp"')}
          <button class="ghost" data-act="del-node" data-i="${i}">Remove node</button></div>
          <h4>Interfaces</h4><div class="sublist">${ifs || '<span class="sub">none</span>'}<button class="ghost" data-act="add-iface" data-i="${i}">+ interface</button></div>
          <h4>Routes</h4><div class="sublist">${routes || '<span class="sub">none</span>'}<button class="ghost" data-act="add-route" data-i="${i}" ${devs.length ? "" : "disabled"}>+ route</button></div></div>`;
      }).join("");
      return `<p class="lead"><code>topology.py</code> returns a <code>Topology</code>: the nodes, each with its interfaces on links (collision domains), its addresses, routes and published ports. It is data: the core builds the Kathará lab from it, writes it into every run as <code>topology.json</code>, and <code>make lab-conf</code> renders it as <code>lab.conf</code> without deploying anything.</p>
      <section class="card prose"><ul>
        <li><strong>Interface order fixes the NIC names:</strong> the first interface is <code>eth0</code>, the next <code>eth1</code>.</li>
        <li><strong>Image:</strong> a node names its own, or takes the lab's (<code>IMAGE</code>); Kathará's default image is for nodes that run no Python of ours.</li>
        <li><strong>Role</strong> is free text (target, infra, attacker, defender…) that topology.json and the docs carry.</li>
        <li><strong>Published ports</strong> (<code>HOST:GUEST/tcp</code>) add a bridged management NIC. That NIC may own a default route, so a node with both must <em>replace</em> its default route rather than add it.</li>
        <li><strong>A passive NIC</strong> is brought up promiscuous and without an address: a sniffer's.</li>
      </ul></section>
      <section class="card"><h3>Nodes</h3><datalist id="roles"><option>target</option><option>infra</option><option>attacker</option><option>defender</option><option>plant</option></datalist>
        ${nodes}<button data-act="add-node">+ node</button></section>
      ${issuesList("topology")}
      <section class="card"><h3>The lab</h3><div id="graph"></div><p class="sub" style="margin-top:6px">Squares are nodes, circles are links; each edge is one interface with its address. Drag to rearrange.</p></section>
      ${filesCard("topology")}${previewCard()}`;
    },

    image() {
      const s = state.spec, n = N(), a = s.agent || {};
      const rows = Object.entries(CONTRACT.images).map(([img, v]) => `<tr><td><code>${esc(img)}</code></td><td><code>${esc(v.dockerfile)}</code></td><td>${v.packages.map(esc).join(", ")}</td></tr>`).join("");
      const newPk = G.NEW === s.image || s.nodes.some(x => x.image === G.NEW);
      const pk = Object.entries(CONTRACT.requirements).map(([p, v]) => `<label class="inline" style="margin-right:12px"><input type="checkbox" data-pkg="${esc(p)}" ${(s.newImagePackages || []).includes(p) ? "checked" : ""}> ${esc(p)}==${esc(v)}</label>`).join("");
      return `<p class="lead">Guest code runs inside the containers, where neither this repository nor its virtualenv exists: it imports the standard library and what its node's image installs, nothing else. Reuse an image whose packages cover what the nodes run; build a new one only for a dependency none has, as <code>cps-recon</code> did for nmap.</p>
      <section class="card"><h3>The images this repository builds</h3><table><tr><th>Image</th><th>Dockerfile</th><th>Python packages</th></tr>${rows}</table>
      <p class="sub" style="margin-top:6px">An image built <code>FROM kathara/&lt;base&gt;</code> also has its base's packages (soc-siem has soc's).</p></section>
      <section class="card"><div class="form">
        <div class="field"><label>The lab's image (<code>IMAGE</code>)</label><select data-path="image" data-type="image">${imageOptions(s.image, false)}</select><div class="hint">Every node that names none runs it.</div></div>
      </div>${newPk ? `<div style="margin-top:10px"><div class="kicker">Python packages of kathara/${esc(n.name)} (pinned to requirements.txt)</div>${pk}</div>` : ""}</section>
      <section class="card prose"><h3>Guest files</h3>
      <p><code>guest_files.py</code> lists, per node, <code>(host path, guest path)</code> pairs; the topology hands each node its list (<code>files=</code>). Software that runs on a node and is not the platform's — the tool it runs, its configuration, the logic that decides and acts — lives under <code>nodes/</code>; the agents that are reusable building blocks of a plane live under <code>cyberrange/planes/&lt;plane&gt;/agents/</code>. Prefer an existing open-source tool, installed by the image and configured from <code>nodes/</code>, to code of our own.</p>
      <p>The skeleton can include a <strong>placeholder agent</strong>: a few lines of stdlib Python that print a heartbeat. It is there to prove the path end to end — staged, launched, its log downloaded and checked — before the real node software exists.</p>
      <div class="form">
        <div class="field"><label class="inline"><input type="checkbox" data-path="agent.enabled" data-type="bool" ${a.enabled ? "checked" : ""}> include a placeholder agent</label></div>
        ${a.enabled ? `<div class="field"><label>On node</label><select data-path="agent.node">${s.nodes.map(x => `<option ${x.name === a.node ? "selected" : ""}>${esc(x.name)}</option>`).join("")}</select></div>
        ${field("Module (guest file name)", "agent.module", a.module, `lands as /${esc(a.module)}.py`)}
        <div class="field"><label>Plane</label><select data-path="agent.plane">${CONTRACT.planes.map(p => `<option ${p === a.plane ? "selected" : ""}>${p}</option>`).join("")}</select><div class="hint">which plane the component belongs to, on the ledger</div></div>` : ""}
      </div></section>
      ${issuesList("image")}
      ${filesCard("image")}`;
    },

    episode() {
      const s = state.spec, a = s.agent || {};
      const rows = s.phases.map((p, i) => `<tr>
        <td><input type="text" data-path="phases.${i}.name" value="${esc(p.name)}"></td>
        <td><label class="inline"><input type="checkbox" data-path="phases.${i}.timed" data-type="bool" ${p.timed ? "checked" : ""}> timed</label></td>
        <td><input type="number" min="0" step="1" style="width:90px" data-path="phases.${i}.seconds" data-type="num" value="${esc(p.seconds)}"> s</td>
        <td class="sub">${p.timed ? `<code>--${esc(String(p.name).replace(/_/g, "-"))}-duration</code>, observed` : "best effort, planned only"}</td>
        <td><button class="ghost" data-act="up-phase" data-i="${i}" ${i ? "" : "disabled"}>↑</button><button class="ghost" data-act="del-phase" data-i="${i}">✕</button></td></tr>`).join("");
      return `<p class="lead">The episode is the scenario's run, between the core's deploy and download. It starts components with <code>ctx.start(...)</code> and wraps each stretch of time in <code>ctx.phase(...)</code>; <code>episode_phases(args)</code> declares the same phases with their planned length, which the dashboard turns into an ETA.</p>
      <section class="card prose"><ul>
        <li><strong>A timed phase</strong> has a fixed length, an option of its own, and is spent in <code>ctx.observe(seconds)</code>, which also polls the started components for the live view.</li>
        <li><strong>A best-effort phase</strong> (setting things up) lasts what it lasts; its planned length only feeds the ETA.</li>
        <li><strong>deploy, download, undeploy</strong> and <strong>open</strong> (a <code>--playground</code> run held up) are the core's. You never stop components or download their files yourself: the core does both after the episode, also when it fails.</li>
        <li><strong>Seeds:</strong> pass <code>ctx.role_seed("&lt;role&gt;")</code> to every component that takes a seed. Each role derives its own from <code>--seed</code>, so a run is reproducible and one role's randomness does not shift when another's changes.</li>
        <li><strong>Components:</strong> reuse the planes' first: choose them below and the skeleton starts them in their phase. <code>GuestAgent</code> is the plainest: one process on one node, its output captured and downloaded as <code>&lt;node&gt;.&lt;log&gt;</code>.</li>
        <li><strong><code>check_run(ctx)</code></strong> decides whether the run counts: 0, or an exit code. A run that produced nothing to score must not pass as one.</li>
      </ul></section>
      <section class="card"><h3>Phases, in run order</h3><table><tr><th>Name</th><th>Kind</th><th>Length</th><th></th><th></th></tr>${rows}</table>
        <button data-act="add-phase" style="margin-top:8px">+ phase</button>
        ${a.enabled ? `<div class="form" style="margin-top:12px"><div class="field"><label>The agent starts in phase</label><select data-path="agent.phase">${s.phases.map(p => `<option ${p.name === a.phase ? "selected" : ""}>${esc(p.name)}</option>`).join("")}</select></div></div>` : ""}</section>
      ${componentsCard()}
      ${issuesList("episode")}
      ${filesCard("episode")}`;
    },

    package() {
      return `<p class="lead">Three small pieces make the directory a scenario the platform knows: the package's accounting, the entry point, and one line in the registry.</p>
      <section class="card prose"><ul>
        <li><strong><code>__init__.py</code></strong> declares what the scenario adds to the code-size accounting (<code>make platform-loc</code>, the paper's table): <code>SOURCES</code>, one category per directory, never two over one file; and <code>GUEST_MANIFESTS</code>, the manifests whose host files count as the scenario's guest code. Every tracked source file under <code>cyberrange/</code> and <code>nodes/</code> must be counted by someone.</li>
        <li><strong><code>cli.py</code></strong>: <code>run()</code> is what tests and campaigns call, <code>main()</code> the command line. The core adds <code>--seed</code>, <code>--progress-file</code>, <code>--run-id</code>, <code>--poll-interval</code> and <code>--playground</code> to the scenario's own options.</li>
        <li><strong>The registry</strong> maps the name to the class. The dashboard, <code>make lab-conf</code>, the loc table and most guardrails find scenarios through it, so it is also what makes them check yours.</li>
      </ul></section>
      ${issuesList("package")}
      ${filesCard("package")}${editsCard("package")}`;
    },

    metrics() {
      return `<p class="lead"><code>Scenario.metrics(run_dir)</code> returns a flat dict of numbers computed from the files a run left behind. Campaigns aggregate it, the dashboard shows it, and a finished run can be scored again at any time. A run started on its own is scored when it ends, and the result goes on its ledger as <code>run_metrics</code>.</p>
      <section class="card prose"><p>The skeleton counts the lab's nodes${state.spec.agent && state.spec.agent.enabled ? " and the agent's lines" : ""}. Replace that with what the experiment is about: detection time, impact, cost. Keep it reading the files in the run directory only: never the live lab, and not the ledger either, which a campaign keeps in one place for all its runs. A score can then be recomputed and compared across runs years apart.</p></section>
      <section class="card prose"><h3>Optional: many runs, and a view of your own</h3>
      <div class="form">
        <div class="field"><label class="inline"><input type="checkbox" data-path="campaign" data-type="bool" ${state.spec.campaign ? "checked" : ""}> write a campaign (<code>campaign.py</code>)</label><div class="hint">One scored run per seed, on one ledger, resumable by name. It adds <code>make ${esc(N().name || "<name>")}-campaign</code>.</div></div>
        <div class="field"><label class="inline"><input type="checkbox" data-path="panel" data-type="bool" ${state.spec.panel ? "checked" : ""}> write a dashboard panel (<code>panel.js</code>)</label><div class="hint">The dashboard already shows every scenario's runs, phases and aggregate. A panel adds what only this one can read; the stub draws one card, the run's metrics.</div></div>
      </div>
      <p>A campaign is units of steps on one ledger (<code>cyberrange/core/campaign.py</code>): the stub's grid is the seeds, and what the experiment varies becomes a second loop. A panel is a factory the page calls with its helpers; it returns only the hooks it implements (<a href="platform/">Architecture</a>, section 5), and <code>tests/core/test_panels.py</code> draws a run through each of them.</p></section>
      ${filesCard("metrics")}`;
    },

    make() {
      return `<p class="lead">Campaigns shell out to make targets and tests parse them: once added, a target name and its <code>-m</code> module are internal API. Module paths are named once, as <code>M_*</code> variables in <code>make/common.mk</code>, so that a module that moves is a one-line edit — and <code>tests/core/test_entry_points.py</code> resolves each of them for real.</p>
      <section class="card prose"><p>One file per scenario: <code>make/${esc(N().name || "<name>")}.mk</code>, with a run, a lab kept up until Ctrl-C (<code>PLAYGROUND</code>), and a dashboard restricted to the scenario's runs. The shared variables (<code>PYTHON</code>, <code>OUTPUT_ROOT</code>, <code>SEED_FLAG</code>, <code>PLAYGROUND_FLAG</code>) come from <code>make/common.mk</code>.</p></section>
      ${filesCard("make")}${editsCard("make")}`;
    },

    tests() {
      return `<p class="lead">The generated test runs the whole lifecycle with <code>tests/helpers/kathara.py</code>: <code>FakeManager</code> stands in for Kathará and <code>fake_downloads</code> for the containers' files, so commands, ledger, artifacts and exit code are checked without Docker. Then a few guardrails have to be told, deliberately, that the scenario exists.</p>
      <section class="card prose"><ul>
        <li><strong><code>test_registry</code></strong> lists every scenario name and goes red until yours is added.</li>
        <li><strong><code>test_guest_imports.py</code></strong> replays each machine's manifest. A machine missing from its table is never checked, and nothing says so.</li>
        <li><strong>Snapshots.</strong> <code>tests/snapshots/lab-${esc(N().name)}.json</code> freezes what each node receives; <code>loc-totals.json</code> the code size. Both are created with <code>UPDATE_SNAPSHOTS=1</code>, on purpose, and the diff is read before it is kept.</li>
        <li><strong><code>MIN_TESTS</code></strong> in <code>tests/conftest.py</code> is a floor on the number of collected tests: raise it by the ${gen.tests} tests added, never lower it.</li>
        <li>Guardrails that need nothing from you, because they follow the registry: unique addresses per link, host paths that resolve, launched modules that are staged, <code>SOURCES</code> patterns that match, layering.</li>
      </ul></section>
      ${filesCard("tests")}${editsCard("tests")}`;
    },

    verify() {
      const n = N(), s = state.spec;
      const agent = s.agent && s.agent.enabled ? s.agent : null;
      return `<p class="lead">The suite never deploys a lab: it proves the scenario is consistent, and only a real run proves it deploys. Go from the cheapest check to the most expensive.</p>
      <section class="card"><h3>Offline</h3>${codeBox(`make lab-conf SCENARIO=${n.name}            # -> output/labconf/${n.name}/: lab.conf, .startup files, staged files
.venv/bin/python -m pytest tests/scenarios/${n.pkg} -q
make fmt                                 # layout only, never logic
make check                               # lint + the suite + a dry run of every make target`, "bash")}</section>
      <section class="card"><h3>A real run</h3>${codeBox(`${G.makeTargets(s).includes(`${n.name}-image`) ? `make ${n.name}-image                       # once, and after every Dockerfile change\n` : ""}make ${n.name} SEED=1                      # one run -> ${n.outDir}
make ${n.name}-dashboard                   # follow it on http://127.0.0.1:${CONTRACT.dashboard_port}
make ${n.name}-lab                         # or keep the lab up to look around, until Ctrl-C`, "bash")}
      <p class="sub" style="margin-top:8px">A good run leaves <code>progress.jsonl</code> ending in <code>run_end</code> with status <code>ok</code>, <code>topology.json</code>${agent ? `, <code>${esc(agent.node)}.${esc(agent.module)}.log</code>` : ""} and the <code>run_metrics</code> on its ledger. Exit code 4 means Docker is not reachable.</p></section>`;
    },

    finish() {
      const n = N();
      const errors = issues.filter(i => i.level === "error");
      return `<p class="lead">Download every new file as one zip and unpack it at the repository root. The zip also carries <code>scenario-edits.json</code>: the edits to files that exist, which <code>tools/apply_scenario_edits.py</code> applies.</p>
      ${errors.length ? `<ul class="issues"><li class="error"><strong>${errors.length} problem(s) to fix first</strong>, in the steps marked in red.</li></ul>` : ""}
      <section class="card"><h3>New files</h3><table><tr><th>Path</th><th>Step</th></tr>${gen.files.map(f => `<tr><td><code>${esc(f.path)}</code></td><td>${esc((steps.find(s => s.id === f.step) || {}).title || "")}</td></tr>`).join("")}</table>
      <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap"><button class="primary" data-act="zip">Download ${esc(n.name || "skeleton")}.zip</button></div>
      ${codeBox(`unzip -n ${n.name || "skeleton"}.zip    # at the repository root; -n never overwrites a file`, "bash")}</section>
      <section class="card"><h3>Apply the edits</h3>
      <p class="sub" style="margin-bottom:8px">The script shows the diff and writes nothing until asked to. It writes every edit or none: a place it cannot find leaves the repository untouched. An edit already made is skipped, so it can be run again.</p>
      ${codeBox(`.venv/bin/python tools/apply_scenario_edits.py            # show the diff
.venv/bin/python tools/apply_scenario_edits.py --write    # apply it
rm scenario-edits.json                                    # once applied`, "bash")}
      <table style="margin-top:10px"><tr><th>File</th><th>What</th><th>How</th><th>Step</th></tr>${gen.edits.map(e => `<tr><td><code>${esc(e.file)}</code></td><td>${esc(e.title)}</td><td>${e.ops.length ? "script" : "<strong>by hand</strong>"}</td><td>${esc((steps.find(s => s.id === e.step) || {}).title || "")}</td></tr>`).join("")}</table></section>
      <section class="card"><div class="form"><div class="field"><label class="inline"><input type="checkbox" data-path="docsPage" data-type="bool" ${state.spec.docsPage ? "checked" : ""}> write a docs page for the scenario</label><div class="hint">Everything under docs/ is published as the documentation site, in English.</div></div></div></section>
      ${filesCard("finish")}${editsCard("finish")}`;
    },
  };

  // ── Step bodies of a variant, where they differ ───────────────────────────
  const VBODY = {
    topology() {
      const rows = (CONTRACT.cps_hosts || []).map(h => `<tr><td><code>${esc(h.name)}</code></td><td>${esc(h.role)}</td><td><code>${esc(h.image)}</code></td></tr>`).join("");
      return `<p class="lead">A variant declares no lab: it runs on the cps one, under its own lab name (<code>${esc(N().lab)}</code>) so that it can be up next to cps. These are the hosts it can build on.</p>
      <section class="card"><h3>The cps lab</h3><table><tr><th>Host</th><th>Role</th><th>Image</th></tr>${rows}</table>
      <p class="sub" style="margin-top:8px">The lab is data (<code>cyberrange/scenarios/cps/lab.py</code>): zones, hosts with a role, and the flows the firewall forwards. Addresses, routes and the firewall's rules are derived from it. <a href="scenario-cps/">The CPS scenario</a> draws it.</p></section>
      <section class="card prose"><h3>When the lab itself must differ</h3><ul>
        <li><strong>Something more on a host that exists</strong> (files, a published port, startup commands, another image): the feature's <code>extras(spec, args)</code> returns <code>{host: T.Extra(...)}</code>. The next step writes one.</li>
        <li><strong>Nodes of the variant's own</strong>, next to the lab's: the feature's <code>nodes(spec, args)</code> returns them as <code>Node</code>s. <code>cps_soc/feature.py</code> adds the Wazuh and IRIS nodes this way.</li>
        <li><strong>Another lab of the family</strong> (more HMIs, another zone): override <code>lab_spec(args)</code> on the scenario to return a <code>LabSpec</code>. Host names may not contain <code>-</code>, and the spec checks its own constraints when it is built.</li>
        <li><strong>Another plant</strong> (feeders, ratings): override <code>plant_spec(args)</code>.</li>
      </ul><p>The skeleton leaves the last three alone: they are the cps scenario's own, read them there before changing them.</p></section>
      ${issuesList("topology")}`;
    },

    image() {
      const s = state.spec, a = s.agent || {}, v = G.variantOf(s);
      const host = (CONTRACT.cps_hosts || []).find(h => h.name === v.host) || {};
      const pkgs = ((CONTRACT.images[host.image] || {}).packages || []).join(", ");
      return `<p class="lead">Guest code runs inside the containers, where neither this repository nor its virtualenv exists: it imports the standard library and what its host's image installs, nothing else. A variant stages its files <em>on top of</em> what the cps lab already puts on the host.</p>
      <section class="card prose"><p><code>guest_files.py</code> lists what the variant adds, as <code>(host path, guest path)</code> pairs; the cps lab's own manifests stay in <code>cyberrange/scenarios/cps/guest_files.py</code> and are counted there. Node software lives under <code>nodes/</code>; prefer an existing open-source tool, installed by the image and configured from <code>nodes/</code>, to code of our own.</p>
      <p>The skeleton can include a <strong>placeholder agent</strong> on one host: a few lines of stdlib Python that print a heartbeat, to prove the path end to end before the real software exists.</p>
      <div class="form">
        <div class="field"><label class="inline"><input type="checkbox" data-path="agent.enabled" data-type="bool" ${a.enabled ? "checked" : ""}> include a placeholder agent</label></div>
        ${a.enabled ? `<div class="field"><label>On host</label><select data-path="variant.host">${(CONTRACT.cps_hosts || []).map(h => `<option ${h.name === v.host ? "selected" : ""}>${esc(h.name)}</option>`).join("")}</select><div class="hint">${esc(host.image || "")}${pkgs ? `: ${esc(pkgs)}` : ""}</div></div>
        ${field("Module (guest file name)", "agent.module", a.module, `lands as /${esc(a.module)}.py`)}
        <div class="field"><label>Plane</label><select data-path="agent.plane">${CONTRACT.planes.map(p => `<option ${p === a.plane ? "selected" : ""}>${p}</option>`).join("")}</select><div class="hint">which plane the component belongs to, on the ledger</div></div>` : ""}
      </div>
      <p class="sub" style="margin-top:10px">A host that needs tools its image lacks takes another image through <code>T.Extra(image=...)</code>, as the attacker of <code>cps-recon</code> does with <code>kathara/redteam</code>. Build that image in <code>docker/</code> and add its target to the make file.</p></section>
      ${issuesList("image")}
      ${filesCard("image")}`;
    },

    episode() {
      const v = G.variantOf(state.spec);
      const rows = (v.options || []).map((o, i) => `<tr>
        <td><input type="text" data-path="variant.options.${i}.name" value="${esc(o.name)}" placeholder="--audit-interval"></td>
        <td><input type="text" style="width:110px" data-path="variant.options.${i}.default" value="${esc(o.default)}"></td>
        <td><input type="text" style="width:100%" data-path="variant.options.${i}.help" value="${esc(o.help)}" placeholder="what it sets"></td>
        <td><button class="ghost" data-act="del-option" data-i="${i}">✕</button></td></tr>`).join("");
      return `<p class="lead">A variant does not write an episode: it runs the cps one. What it adds is a <code>Feature</code>, a class that implements only the hooks of what it adds; the scenario is <code>CpsScenario</code> with that feature in its <code>features</code> tuple.</p>
      <section class="card prose"><h3>The hooks</h3><ul>
        <li><strong><code>add_arguments(ap)</code>, <code>validate(args)</code></strong>: the variant's own options, checked before anything deploys.</li>
        <li><strong><code>extras(spec, args)</code>, <code>nodes(spec, args)</code></strong>: what it adds to the lab (previous steps).</li>
        <li><strong><code>services(ctx)</code></strong>: components started with the lab's services, before normal operation. The placeholder agent starts here.</li>
        <li><strong><code>engage(ctx)</code></strong>: called once the ground truth is open, when an attack may begin. What must be recorded as part of the attack starts here.</li>
        <li><strong><code>attacker(scenario, args)</code></strong>: the attack driver, when the variant brings its own (<code>cps_recon/feature.py</code>).</li>
        <li><strong><code>host_ports</code>, <code>links</code>, <code>operator_api</code>, <code>check_approval</code>, <code>run_info</code>, <code>prepare</code></strong>: published ports, what each team is handed, the SOC's operator arguments, run metadata. <code>cps_advisor/feature.py</code> uses them all.</li>
      </ul><p>Features are called in the order the scenario lists them, so two of them compose: <code>cps-soc</code> is <code>(SocTools(), People(console=False))</code>. Pass <code>ctx.role_seed("&lt;role&gt;")</code> to every component that takes a seed.</p></section>
      <section class="card"><h3>Options the variant adds</h3>
        ${rows ? `<table><tr><th>Option</th><th>Default</th><th>Help</th><th></th></tr>${rows}</table>` : '<p class="sub">None yet.</p>'}
        <button data-act="add-option" style="margin-top:8px">+ option</button>
        <p class="sub" style="margin-top:8px">The cps options (attack mode, response policy, durations, detectors) are already there; the guide refuses a name one of them has.</p></section>
      ${componentsCard()}
      ${issuesList("episode")}
      ${filesCard("episode")}`;
    },

    metrics() {
      return `<p class="lead">A variant is scored as cps is: <code>CpsScenario.metrics</code> computes detection, impact and response from the run directory, and the campaign and the dashboard read it. The skeleton writes no <code>metrics.py</code>.</p>
      <section class="card prose"><p>When the variant measures something of its own, override <code>metrics(self, run_dir)</code> in <code>scenario.py</code>: call the cps one and add keys to what it returns, from files the run left on disk (<code>cps-recon</code> adds how close the attacker's tree was to the real one). Keep the result a flat dict of numbers, computed from the run directory alone, so a finished run can be scored again.</p>
      <p>The dashboard panel works the same way: <code>panel.js</code> registers the scenario's name and returns what the cps panel returns. Wrap that to draw what only this variant has.</p></section>`;
    },

    tests() {
      return `<p class="lead">The lab and the episode are tested with cps. The generated test checks what the variant adds, without Docker: its name and lab, its options, what it stages on which host and what its feature starts. Then a few guardrails have to be told, deliberately, that the scenario exists.</p>
      <section class="card prose"><ul>
        <li><strong><code>test_registry</code></strong> lists every scenario name and goes red until yours is added.</li>
        <li><strong><code>test_guest_imports.py</code></strong> replays each machine's manifest. A machine missing from its table is never checked, and nothing says so.</li>
        <li><strong>Snapshots.</strong> <code>tests/snapshots/lab-${esc(N().name)}.json</code> freezes what each node receives: the cps lab plus what the variant stages. <code>loc-totals.json</code> freezes the code size. Both are created with <code>UPDATE_SNAPSHOTS=1</code>, on purpose, and the diff is read before it is kept.</li>
        <li><strong><code>MIN_TESTS</code></strong> in <code>tests/conftest.py</code> is a floor on the number of collected tests: raise it by the ${gen.tests} tests added, never lower it.</li>
        <li><strong>The panel contract</strong> (<code>test_panels.py</code>) loads <code>panel.js</code> through the registry: it must register the scenario's name.</li>
      </ul></section>
      ${filesCard("tests")}${editsCard("tests")}`;
    },

    verify() {
      const n = N(), s = state.spec;
      const agent = s.agent && s.agent.enabled ? G.variantOf(s).host + "." + s.agent.module + ".log" : "";
      return `<p class="lead">The suite never deploys a lab: it proves the variant is consistent, and only a real run proves it deploys. Go from the cheapest check to the most expensive.</p>
      <section class="card"><h3>Offline</h3>${codeBox(`make lab-conf SCENARIO=${n.name}            # -> output/labconf/${n.name}/: the cps lab with what the variant stages
.venv/bin/python -m pytest tests/scenarios/${n.pkg} -q
make fmt                                 # layout only, never logic
make check                               # lint + the suite + a dry run of every make target`, "bash")}</section>
      <section class="card"><h3>A real run</h3>${codeBox(`make cps-image                           # once: the cps lab's images
make ${n.name}-lab SEED=1                  # normal operation only: does what the variant adds come up?
make ${n.name} SEED=1                      # attack the lab -> ${n.outDir}
make ${n.name}-dashboard                   # follow it on http://127.0.0.1:${CONTRACT.dashboard_port}`, "bash")}
      <p class="sub" style="margin-top:8px">A good run leaves what a cps run leaves (<code>progress.jsonl</code> ending in <code>run_end</code> with status <code>ok</code>, the plant and sensor records, <code>ground_truth.jsonl</code>)${agent ? `, and <code>${esc(agent)}</code>` : ""}. Exit code 4 means Docker is not reachable.</p></section>`;
    },
  };

  // The components chosen for the episode: one card each, its constructor as a form.
  function componentsCard() {
    const s = state.spec, list = s.components || [];
    const nodeNames = variant ? (CONTRACT.cps_hosts || []).map(h => h.name) : (s.nodes || []).map(x => x.name);
    const byPlane = {};
    for (const [name, d] of Object.entries(CONTRACT.components || {})) (byPlane[d.plane] = byPlane[d.plane] || []).push(name);
    const typeOptions = cur => Object.keys(byPlane).sort().map(pl =>
      `<optgroup label="${esc(pl)}">${byPlane[pl].map(nm => `<option ${nm === cur ? "selected" : ""}>${esc(nm)}</option>`).join("")}</optgroup>`).join("");
    const cards = list.map((c, i) => {
      const d = (CONTRACT.components || {})[c.type];
      if (!d) return `<div class="nodecard"><div class="row"><span>Unknown component <code>${esc(c.type)}</code></span><button class="ghost" data-act="del-component" data-i="${i}">Remove</button></div></div>`;
      const params = d.params.map(p => {
        const path = `components.${i}.args.${p.name}`, v = (c.args || {})[p.name] || "";
        const required = p.default === null && p.name !== "seed";
        const label = `<label><code>${esc(p.name)}</code>${required ? " · required" : ""}</label>`;
        if (CONTRACT.node_params.includes(p.name))
          return `<div class="field">${label}<select data-path="${path}"><option value="">${p.default !== null ? `default: ${esc(p.default)}` : "choose a node"}</option>${nodeNames.map(nn => `<option ${nn === v ? "selected" : ""}>${esc(nn)}</option>`).join("")}</select></div>`;
        const hint = p.name === "seed" ? "ctx.role_seed(…), automatic" : required ? "a Python expression" : `default: ${p.default}`;
        return `<div class="field">${label}<input type="text" class="mono" data-path="${path}" value="${esc(v)}" placeholder="${esc(hint)}"></div>`;
      }).join("");
      const nodes = G.componentNodes(CONTRACT, c);
      const stages = d.files.length
        ? `Stages on ${nodes.join(", ") || "its node"}: ${d.files.map(f => f[1].slice(1)).join(", ")}.${d.needs.length ? ` Its image must install ${d.needs.join(", ")}.` : ""}`
        : "Stages no file of its own.";
      return `<div class="nodecard"><div class="row">
        <div class="field"><label>Component</label><select data-path="components.${i}.type">${typeOptions(c.type)}</select></div>
        ${variant ? "" : `<div class="field"><label>Starts in phase</label><select data-path="components.${i}.phase">${(s.phases || []).map(ph => `<option ${ph.name === c.phase ? "selected" : ""}>${esc(ph.name)}</option>`).join("")}</select></div>`}
        <button class="ghost" data-act="del-component" data-i="${i}">Remove</button></div>
        <p class="sub" style="margin:0 0 8px">${esc(d.doc) || "(no description)"}${d.drives ? " <strong>A driver:</strong> the skeleton opens the ground truth, starts it and calls its <code>attack(ctx)</code>, which blocks while it acts." : ""}</p>
        <div class="form">${params || '<span class="sub">It takes no argument.</span>'}</div>
        <p class="sub" style="margin-top:8px">${esc(stages)}</p></div>`;
    }).join("");
    return `<section class="card"><h3>Components of the planes</h3>
      <p class="sub" style="margin-bottom:10px">Every component of <code>cyberrange/planes/*/components.py</code>, with its constructor as it is in the code today; <a href="components/">Components</a> says what each one does, starts and leaves behind. A value is a <strong>Python expression</strong>, written into the call as typed: <code>"eth0"</code>, <code>8080</code>, <code>a.my_option</code> (<code>a</code> is the run's arguments). An optional argument left empty keeps its default. The guide stages the guest files a component launches, with the modules they import, and checks them against the node's image; system tools and configuration it needs (tcpdump, ttyd, a Wazuh agent) are the image's and yours to check.</p>
      ${cards}<button data-act="add-component">+ component</button></section>`;
  }

  function previewCard() {
    const files = gen.preview || [];
    if (!files.length) return "";
    const cur = files.find(f => f.path === state.tab.preview) || files[0];
    return `<section class="card"><h3>What Kathará is given</h3>
      <p class="sub" style="margin-bottom:8px">The lab as <code>make lab-conf SCENARIO=${esc(N().name || "<name>")}</code> will render it, once the scenario is registered: <code>lab.conf</code> and one startup file per node. The form above is the source; this is its reading.</p>
      <div class="tabs" role="tablist">${files.map(f => `<button role="tab" data-tab="${esc(f.path)}" data-step="preview" aria-selected="${f === cur}">${esc(f.path)}</button>`).join("")}</div>
      ${codeBox(cur.content.trim() ? cur.content : "# (no startup commands)\n", cur.lang)}</section>`;
  }

  function main() {
    const i = Math.max(0, stepIndex(state.step));
    const step = steps[i];
    const render = (variant && VBODY[step.id]) || BODY[step.id];
    return `<div class="kicker">Step ${i + 1} of ${steps.length}${variant ? " · variant of the cps lab" : ""}</div><h2>${esc(step.title)}</h2>${render()}${checklist(step)}
      <div class="navbtns"><button data-goto="${i ? steps[i - 1].id : ""}" ${i ? "" : "disabled"}>← ${i ? esc(steps[i - 1].title) : ""}</button>
      ${i < steps.length - 1 ? `<button class="primary" data-goto="${steps[i + 1].id}">${esc(steps[i + 1].title)} →</button>` : ""}</div>`;
  }
  return { gen, issues, main, filesCard, editsCard, previewCard, issuesList };
  }

  G.view = view; G.STEPS = STEPS; G.stepsFor = stepsFor; G.esc = esc;
})(globalThis);
// END view
</script>

<script>
(function () {
  "use strict";
  const G = window.ScenarioGuide;
  const block = id => JSON.parse(document.getElementById(id).textContent);
  const CONTRACT = Object.assign({}, block("guide-contract"), block("guide-contract-derived"));
  const STORE = "cyberrange.scenario-guide.v1";

  // ── State: the spec, the ticked checks, the open step ─────────────────────
  const blank = G.blankSpec;
  const clone = o => JSON.parse(JSON.stringify(o));
  let state = { spec: clone(G.EXAMPLE_SPEC), checks: {}, step: "start", tab: {} };
  try {
    const saved = JSON.parse(localStorage.getItem(STORE) || "null");
    if (saved && saved.spec) state = Object.assign(state, saved);
    // Answers saved by an older page lack the fields added since: give them the blank ones.
    state.spec = Object.assign(G.blankSpec(), state.spec);
  } catch (e) { /* private mode or blocked storage: the guide still works, unsaved */ }
  const save = () => { try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) { /* see above */ } };

  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const md = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  const $ = (sel, el = document) => el.querySelector(sel);
  function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove("show"), 1600); }

  // ── What to show: computed by view(), kept for the handlers ───────────────
  const N = () => G.names(state.spec);
  const stepsNow = () => G.stepsFor(state.spec);
  let shown = null, gen = null, issues = [];
  function regenerate() {
    shown = G.view(state, CONTRACT);
    gen = shown.gen; issues = shown.issues;
    if (gen.error) console.error(gen.error);
  }

  // ── Rendering ─────────────────────────────────────────────────────────────
  function stepState(step) {
    const done = state.checks[step.id] || {};
    const all = step.checks.every(([id]) => done[id]);
    const err = issues.some(i => i.step === step.id && i.level === "error");
    return { all, err };
  }
  function renderNav() {
    const STEPS = stepsNow();
    $("#nav").innerHTML = STEPS.map((s, i) => {
      const st = stepState(s);
      return `<li class="${st.err ? "err" : st.all ? "done" : ""}"><button data-goto="${s.id}" ${s.id === state.step ? 'aria-current="step"' : ""}><span class="num">${st.all && !st.err ? "✓" : i + 1}</span>${esc(s.title)}</button></li>`;
    }).join("");
    const total = STEPS.reduce((a, s) => a + s.checks.length, 0);
    const ticked = STEPS.reduce((a, s) => a + s.checks.filter(([id]) => (state.checks[s.id] || {})[id]).length, 0);
    $("#progress-label").textContent = `${ticked} of ${total} checks`;
    $("#progress-bar").style.width = `${Math.round((100 * ticked) / total)}%`;
  }
  function renderStep() {
    regenerate();
    $("#main").innerHTML = shown.main();
    // Opened from the file system, the site's page URLs (extending/) do not
    // exist: point at the Markdown sources next to this file instead.
    if (location.protocol === "file:")
      for (const a of document.querySelectorAll('#main a[href$="/"]')) a.href = a.getAttribute("href").replace(/\/$/, ".md");
    renderNav();
    if (state.step === "topology") drawGraph();
  }
  // A change typed into a field refreshes what depends on it, not the form: a
  // re-render would take the focus away mid-word.
  let pending = null;
  function refreshSoon() {
    clearTimeout(pending);
    pending = setTimeout(() => {
      regenerate();
      for (const el of document.querySelectorAll("#main .issues")) el.outerHTML = shown.issuesList(state.step);
      for (const card of document.querySelectorAll("#main section.card")) {
        const h = card.querySelector("h3");
        if (!h) continue;
        if (h.textContent === "Files this step writes") card.outerHTML = shown.filesCard(state.step);
        else if (h.textContent === "Edits to files that exist") card.outerHTML = shown.editsCard(state.step);
        else if (h.textContent === "What Kathará is given") card.outerHTML = shown.previewCard();
      }
      renderNav();
      if (state.step === "topology") drawGraph();
    }, 250);
  }

  // ── Topology graph ────────────────────────────────────────────────────────
  let cy = null;
  function drawGraph() {
    const el = $("#graph");
    if (!el) return;
    if (!window.cytoscape) { el.innerHTML = '<p class="sub" style="padding:12px">The graph library did not load (offline?): the rest of the guide works without it.</p>'; return; }
    const css = getComputedStyle(document.documentElement);
    const v = k => css.getPropertyValue(k).trim();
    const els = [];
    for (const link of G.linksOf(state.spec)) els.push({ data: { id: `l:${link}`, label: link }, classes: "link" });
    for (const nd of state.spec.nodes) {
      els.push({ data: { id: `n:${nd.name}`, label: `${nd.name}\n${nd.role || ""}` }, classes: "node" });
      (nd.ifaces || []).forEach((f, j) => {
        if (f.link) els.push({ data: { id: `e:${nd.name}:${j}`, source: `n:${nd.name}`, target: `l:${f.link}`, label: `eth${j} ${f.cidr ? f.cidr.split("/")[0] : "passive"}` } });
      });
    }
    if (cy) cy.destroy();
    try {
      cy = cytoscape({
        container: el, elements: els, maxZoom: 1.6,
        layout: { name: "cose", animate: false, padding: 20, nodeRepulsion: 4500, idealEdgeLength: 60 },
        style: [
          { selector: "node.node", style: { shape: "round-rectangle", "background-color": v("--s1"), label: "data(label)", color: "#fff",
            "text-wrap": "wrap", "text-valign": "center", "font-size": 12, width: 92, height: 44 } },
          { selector: "node.link", style: { shape: "ellipse", "background-color": v("--s2"), label: "data(label)", color: "#fff",
            "text-valign": "center", "font-size": 12, width: 50, height: 50 } },
          { selector: "edge", style: { width: 1.5, "line-color": v("--axis"), label: "data(label)", "font-size": 11, color: v("--ink-2"),
            "text-background-color": v("--page"), "text-background-opacity": 1, "text-background-padding": 2, "curve-style": "bezier" } },
        ],
      });
    } catch (e) { el.innerHTML = `<p class="sub" style="padding:12px">${esc(e.message)}</p>`; }
  }

  // ── Editing the spec ──────────────────────────────────────────────────────
  function setPath(obj, path, value) {
    const keys = path.split(".");
    let o = obj;
    for (const k of keys.slice(0, -1)) o = o[k];
    o[keys[keys.length - 1]] = value;
  }
  function valueOf(el) {
    const t = el.dataset.type;
    if (t === "bool") return el.checked;
    if (t === "num") return el.value === "" ? 0 : Number(el.value);
    if (t === "csv") return el.value.split(",").map(s => s.trim()).filter(Boolean);
    if (t === "image") return el.value === "__default" ? null : el.value;
    return el.value;
  }
  const STRUCTURAL = /^(kind|campaign|panel|variant\.host|components\.\d+\.(type|phase)|components\.\d+\.args\.(node|ca_node|client_node|router|scmc)|agent\.enabled|image|nodes\.\d+\.image|docsPage|phases\.\d+\.timed|nodes\.\d+\.name|phases\.\d+\.name)$/;
  function onEdit(e) {
    const el = e.target;
    if (el.dataset.path) {
      const path = el.dataset.path;
      // Renaming a node or a phase carries the agent's reference along.
      const old = path.endsWith(".name") ? path.split(".").reduce((o, k) => o[k], state.spec) : null;
      setPath(state.spec, path, valueOf(el));
      // Another component has another constructor: the answers to the old one go.
      const retyped = /^components\.(\d+)\.type$/.exec(path);
      if (retyped) state.spec.components[+retyped[1]].args = {};
      if (old !== null && state.spec.agent) {
        if (path.startsWith("nodes.") && state.spec.agent.node === old) state.spec.agent.node = el.value;
        for (const c of state.spec.components || []) {
          if (path.startsWith("phases.") && c.phase === old) c.phase = el.value;
          if (path.startsWith("nodes.")) for (const k of Object.keys(c.args || {})) if (CONTRACT.node_params.includes(k) && c.args[k] === old) c.args[k] = el.value;
        }
        if (path.startsWith("phases.") && state.spec.agent.phase === old) state.spec.agent.phase = el.value;
      }
      save();
      if (e.type === "change" && STRUCTURAL.test(path)) renderStep(); else refreshSoon();
    } else if (el.dataset.check) {
      const [s, id] = el.dataset.check.split(".");
      (state.checks[s] = state.checks[s] || {})[id] = el.checked;
      save(); renderNav();
    } else if (el.dataset.pkg) {
      const set = new Set(state.spec.newImagePackages || []);
      el.checked ? set.add(el.dataset.pkg) : set.delete(el.dataset.pkg);
      state.spec.newImagePackages = [...set].sort();
      save(); refreshSoon();
    }
  }
  document.addEventListener("input", e => { if (e.target.closest("#main") && e.target.type !== "checkbox" && e.target.tagName !== "SELECT") onEdit(e); });
  document.addEventListener("change", e => { if (e.target.closest("#main")) onEdit(e); });

  const ACT = {
    "add-node": () => { const k = state.spec.nodes.length + 1; state.spec.nodes.push({ name: `node${k}`, role: "target", image: null, mgmtPort: "", ifaces: [{ link: "A", cidr: "", aliases: [], promisc: false }], routes: [] }); },
    "del-node": d => { state.spec.nodes.splice(+d.i, 1); },
    "add-iface": d => { state.spec.nodes[+d.i].ifaces.push({ link: "A", cidr: "", aliases: [], promisc: false }); },
    "del-iface": d => { const nd = state.spec.nodes[+d.i]; nd.ifaces.splice(+d.j, 1); nd.routes = nd.routes.filter(r => Number(String(r.dev).slice(3)) < nd.ifaces.length); },
    "add-route": d => { state.spec.nodes[+d.i].routes.push({ dest: "default", via: "", dev: "eth0", replace: false }); },
    "del-route": d => { state.spec.nodes[+d.i].routes.splice(+d.j, 1); },
    "add-component": () => { (state.spec.components = state.spec.components || []).push({ type: "TelemetryMirror", phase: ((state.spec.phases || [])[0] || {}).name || "", args: {} }); },
    "del-component": d => { state.spec.components.splice(+d.i, 1); },
    "add-option": () => { (state.spec.variant.options = state.spec.variant.options || []).push({ name: "--", default: "", help: "" }); },
    "del-option": d => { state.spec.variant.options.splice(+d.i, 1); },
    "add-phase": () => { state.spec.phases.push({ name: `phase${state.spec.phases.length + 1}`, timed: true, seconds: 30 }); },
    "del-phase": d => { state.spec.phases.splice(+d.i, 1); },
    "up-phase": d => { const p = state.spec.phases, i = +d.i; [p[i - 1], p[i]] = [p[i], p[i - 1]]; },
    "zip": () => { downloadZip(); return false; },
  };
  document.addEventListener("click", e => {
    const b = e.target.closest("button");
    if (!b) return;
    if (b.dataset.goto !== undefined && b.dataset.goto !== "") { state.step = b.dataset.goto; save(); renderStep(); window.scrollTo(0, 0); return; }
    if (b.dataset.act && ACT[b.dataset.act]) { if (ACT[b.dataset.act](b.dataset) !== false) { save(); renderStep(); } return; }
    if (b.dataset.tab) { state.tab[b.dataset.step] = b.dataset.tab; save(); renderStep(); return; }
    if (b.dataset.code !== undefined) {
      const text = b.closest(".codebox").querySelector("textarea").value;
      const done = () => toast("Copied");
      if (navigator.clipboard) navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text));
      else fallbackCopy(text);
      return;
    }
    if (b.dataset.dl) { const f = gen.files.find(x => x.path === b.dataset.dl); if (f) saveBlob(new Blob([f.content], { type: "text/plain" }), f.path.split("/").pop()); }
  });
  function fallbackCopy(text) {
    const t = document.createElement("textarea"); t.value = text; document.body.appendChild(t); t.select();
    try { document.execCommand("copy"); toast("Copied"); } catch (e) { toast("Copy failed: select the text by hand"); }
    t.remove();
  }
  function saveBlob(blob, name) {
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  }
  function downloadZip() {
    regenerate();
    const errors = issues.filter(i => i.level === "error");
    if (errors.length && !confirm(`${errors.length} problem(s) are still marked in red. Download the skeleton anyway?`)) return;
    if (!window.JSZip) { toast("The zip library did not load: save the files one by one with Save"); return; }
    const zip = new JSZip();
    for (const f of gen.files) zip.file(f.path, f.content);
    zip.file("scenario-edits.json", JSON.stringify(gen.editsFile, null, 1) + "\n");
    zip.generateAsync({ type: "blob" }).then(b => saveBlob(b, `${N().name || "skeleton"}.zip`));
  }

  $("#btn-zip").addEventListener("click", downloadZip);
  $("#btn-example").addEventListener("click", () => {
    // The example of the kind being built: a lab of its own, or a variant of cps.
    state.spec = clone(G.isVariant(state.spec) ? G.EXAMPLE_VARIANT : G.EXAMPLE_SPEC);
    save(); renderStep(); toast("Example loaded");
  });
  $("#btn-reset").addEventListener("click", () => {
    if (!confirm("Start again from an empty scenario? Your answers and ticks are cleared.")) return;
    state = { spec: blank(), checks: {}, step: "identity", tab: {} }; save(); renderStep();
  });
  $("#btn-export").addEventListener("click", () => {
    const text = JSON.stringify(G.exportSpec(state.spec), null, 1) + "\n";
    saveBlob(new Blob([text], { type: "application/json" }), `${N().name || "scenario"}.scenario.json`);
  });
  $("#btn-import").addEventListener("click", () => $("#file-import").click());
  $("#file-import").addEventListener("change", e => {
    const file = e.target.files[0];
    e.target.value = ""; // the same file can be chosen again
    if (!file) return;
    file.text().then(text => {
      state.spec = G.importSpec(JSON.parse(text));
      state.tab = {};
      save(); renderStep(); toast(`Loaded ${file.name}`);
    }).catch(err => alert(`Could not load ${file.name}: ${err.message}`));
  });
  const theme = $("#theme");
  try { theme.value = localStorage.getItem(STORE + ".theme") || ""; } catch (e) { /* see above */ }
  const applyTheme = () => {
    if (theme.value) document.documentElement.dataset.theme = theme.value; else delete document.documentElement.dataset.theme;
    try { localStorage.setItem(STORE + ".theme", theme.value); } catch (e) { /* see above */ }
    if (state.step === "topology") drawGraph();
  };
  theme.addEventListener("change", applyTheme);
  applyTheme();
  renderStep();
})();
</script>
</body>
