# Tooling configuration only.
#
# There is deliberately no [project] table and no packaging metadata: the repo
# is run from its root (`python -m cyberrange...`, `make ...`), never installed.
# An editable install during a path refactor would shadow the sources with a
# stale copy and make the suite pass for the wrong reason.

[tool.pytest.ini_options]
# The repo root on sys.path, so `import cyberrange...` works without installing.
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "slow: heavy test (torch/pandapower/matplotlib, subprocesses, sleeps). Deselect with -m 'not slow'.",
]
